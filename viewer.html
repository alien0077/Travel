<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行程檢視器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .tab-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .pulse-active { box-shadow: 0 0 12px rgba(99, 102, 241, 0.4); }
        #map-container { height: 220px; border-radius: 12px; width: 100%; }
        .attraction-status { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 999px; }
        .viewer-original .timeline-card { box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06); }
        .viewer-original .timeline-card:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(15, 23, 42, 0.1); }
        .viewer-original .timeline-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }

        /* Original itinerary skin: keep the shared data model, restore the source HTML visual language. */
        body.viewer-original {
            background: #f8fafc !important;
            font-family: 'Noto Sans TC', 'Plus Jakarta Sans', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }
        .viewer-original .viewer-header {
            background: linear-gradient(90deg, #d97706, #f59e0b, #d97706) !important;
            box-shadow: 0 3px 10px rgba(120, 53, 15, 0.22) !important;
        }
        .viewer-original .viewer-header-row { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .viewer-original .viewer-brand { min-width: 0; }
        .viewer-original .viewer-flag { font-size: 1.55rem; line-height: 1; }
        .viewer-original .viewer-back {
            background: rgba(120, 53, 15, 0.42) !important;
            color: #fff7ed !important;
            padding: 0.45rem 0.6rem !important;
            border-radius: 0.75rem !important;
        }
        .viewer-original .viewer-header h1 { color: #fff; letter-spacing: 0.02em; }
        .viewer-original .viewer-header p { color: #fef3c7 !important; }
        .viewer-original .viewer-date-chip {
            background: rgba(146, 64, 14, 0.62);
            color: #fef3c7;
            border: 1px solid rgba(251, 191, 36, 0.35);
            white-space: nowrap;
        }
        .viewer-original .viewer-action {
            background: #10b981 !important;
            color: white !important;
            border: 1px solid rgba(167, 243, 208, 0.45);
        }
        .viewer-original #tab-bar {
            position: static !important;
            top: auto !important;
            margin: 0 auto !important;
            padding: 0.5rem 0.5rem 0.6rem !important;
            background: rgba(120, 53, 15, 0.9) !important;
            border-top: 1px solid rgba(245, 158, 11, 0.3);
            gap: 0.375rem !important;
        }
        .viewer-original #tab-bar .tab-btn {
            flex: 0 0 auto !important;
            min-height: 2.25rem;
            padding: 0.5rem 0.75rem !important;
            border: 0 !important;
            border-radius: 0.75rem !important;
            box-shadow: none !important;
            color: #fde68a !important;
            background: rgba(69, 26, 3, 0.42) !important;
        }
        .viewer-original #tab-bar .tab-btn.bg-indigo-600,
        .viewer-original #tab-bar .tab-btn.tab-active {
            color: #fff !important;
            background: #f59e0b !important;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35) !important;
        }
        .viewer-original .viewer-flight-wrap,
        .viewer-original .viewer-map-wrap { padding-top: 1rem; }
        .viewer-original .viewer-flight-card,
        .viewer-original #route-map-section {
            border-color: #e2e8f0 !important;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06) !important;
        }
        .viewer-original .viewer-flight-card .flight-label { color: #d97706; }
        .viewer-original .viewer-flight-card .flight-copy { color: #334155; }
        .viewer-original #route-map-section h3 { color: #334155 !important; }
        .viewer-original #route-map-section > div:first-child i,
        .viewer-original #route-day-label { color: #f59e0b !important; }
        .viewer-original #map-container { border-radius: 0.75rem; }
        .viewer-original main { padding-bottom: 1rem; }
        .viewer-original .day-hero { box-shadow: 0 4px 10px rgba(15, 23, 42, 0.12) !important; }
        .viewer-original .day-hero.day-day1 { background: linear-gradient(135deg, #f59e0b, #d97706) !important; }
        .viewer-original .day-hero.day-day2 { background: linear-gradient(135deg, #0891b2, #0e7490) !important; }
        .viewer-original .day-hero.day-day3 { background: linear-gradient(135deg, #f43f5e, #e11d48) !important; }
        .viewer-original .day-hero.day-day4 { background: linear-gradient(135deg, #10b981, #059669) !important; }
        .viewer-original .day-hero.day-day5 { background: linear-gradient(135deg, #64748b, #334155) !important; }
        .viewer-original .day-timeline-panel { border-color: #e2e8f0 !important; }
        .viewer-original .day-timeline-panel > h3 { color: #334155 !important; }
        .viewer-original .timeline-card.timeline-transport {
            background: #ecfdf5 !important;
            border-color: #a7f3d0 !important;
        }
        .viewer-original .timeline-card.timeline-food {
            background: #fff1f2 !important;
            border-color: #fecdd3 !important;
        }
        .viewer-original .timeline-card.timeline-hotel {
            background: #fffbeb !important;
            border-color: #fde68a !important;
        }
        .viewer-original .timeline-card.timeline-sight { background: #fff !important; }
        .viewer-original .timeline-marker.timeline-marker-transport { background: #059669 !important; }
        .viewer-original .timeline-marker.timeline-marker-food { background: #e11d48 !important; }
        .viewer-original .timeline-marker.timeline-marker-hotel { background: #d97706 !important; }
        .viewer-original .timeline-marker.timeline-marker-sight { background: #3b82f6 !important; }
        .viewer-original .food-panel,
        .viewer-original .parking-panel,
        .viewer-original .hotel-panel {
            border-color: #e2e8f0 !important;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06) !important;
        }
        .viewer-original .food-item { background: rgba(255, 247, 237, 0.7) !important; border-color: #fed7aa !important; }
        .viewer-original .parking-item { background: rgba(239, 246, 255, 0.72) !important; border-color: #bfdbfe !important; }
        .viewer-original .hotel-item { background: rgba(250, 245, 255, 0.72) !important; border-color: #ddd6fe !important; }
        .viewer-original .details-panel { background: #fffbeb !important; border-color: #fde68a !important; }
        .viewer-original #tools-panel > div,
        .viewer-original #quick-note { border-color: #e2e8f0 !important; }
        .viewer-original .source-tab-panel,
        .viewer-original .food-tab-panel {
            border-color: #e2e8f0 !important;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06) !important;
        }
        .viewer-original .source-tab-line {
            color: #475569;
            font-size: 0.72rem;
            line-height: 1.65;
        }
        .viewer-original .source-tab-line.source-tab-heading {
            color: #92400e;
            font-weight: 800;
            font-size: 0.78rem;
            padding-top: 0.35rem;
        }
        .viewer-original .food-tab-item {
            background: #fff7ed;
            border: 1px solid #fed7aa;
        }
        .viewer-original .food-tab-item:nth-child(2n) {
            background: #fff1f2;
            border-color: #fecdd3;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-24 min-h-screen">
    <div id="app-root"></div>

    <div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-max max-w-[280px]"></div>

    <script>
        const VIEWER_BUILD = '5de8bc3';
        const params = new URLSearchParams(location.search);
        const tripId = params.get('trip');

        if (!tripId) {
            document.getElementById('app-root').innerHTML = `
                <div class="flex items-center justify-center min-h-screen">
                    <div class="text-center p-8">
                        <div class="text-4xl mb-4">🧭</div>
                        <h1 class="font-bold text-lg mb-2">未指定行程</h1>
                        <p class="text-slate-500 text-sm mb-4">請從首頁選擇一個行程。</p>
                        <a href="index.html" class="text-indigo-600 font-bold hover:underline">回到首頁 ➔</a>
                    </div>
                </div>
            `;
        } else {
            loadTrip(tripId);
        }

        async function loadTrip(id) {
            const root = document.getElementById('app-root');
            try {
                const res = await fetch(`trips/${id}.json?v=${VIEWER_BUILD}`, { cache: 'no-store' });
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();
                renderTrip(root, data);
            } catch (e) {
                root.innerHTML = `
                    <div class="flex items-center justify-center min-h-screen">
                        <div class="text-center p-8">
                            <div class="text-4xl mb-4">😕</div>
                            <h1 class="font-bold text-lg mb-2">行程不存在</h1>
                            <p class="text-slate-500 text-sm mb-2">找不到「${id}」這個行程。</p>
                            <button onclick="location.reload()" class="text-indigo-600 font-bold hover:underline mr-4">重試</button>
                            <a href="index.html" class="text-indigo-600 font-bold hover:underline">回到首頁 ➔</a>
                        </div>
                    </div>
                `;
            }
        }

        function renderTrip(root, data) {
            const isDrive = data.type === 'drive';
            const APP_ID = `trip-${data.id}`;
            const currencyCode = data.currency || 'JPY';
            const currencyName = data.currencyName || '日幣';
            const currencyRate = data.currencyToTwdRate ?? data.jpyToTwdRate ?? null;
            document.body.classList.toggle('viewer-original', (data.ui?.theme || 'original') === 'original');
            document.title = `${data.title} - ${data.subtitle || ''}`;
            const headerIcon = data.headerIcon || (data.countries?.includes('TH') ? '🇹🇭' : (isDrive ? '🚗' : '🗾'));
            const formatDate = value => String(value || '').replace(/-/g, '.');
            const dateRange = data.dateStart && data.dateEnd
                ? `${formatDate(data.dateStart)} - ${formatDate(data.dateEnd).replace(/^\d{4}\./, '')}`
                : (data.subtitle || '');

            let state = loadState(APP_ID, data);
            let activeTab = state.activeTab || Object.keys(data.days)[0];

            function saveState() {
                try { localStorage.setItem(APP_ID, JSON.stringify(state)); } catch(e) {}
            }

            // Build header
            root.innerHTML = `
                <header class="viewer-header bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white shadow-xl sticky top-0 z-40">
                    <div class="viewer-header-row max-w-md mx-auto px-4 flex justify-between items-center gap-2">
                        <div class="viewer-brand flex items-center gap-2 min-w-0">
                            <a href="index.html" class="viewer-back bg-indigo-600 p-2 rounded-xl hover:bg-indigo-500 transition-all shrink-0" aria-label="回到首頁">
                                <i class="fa-solid fa-arrow-left text-xl"></i>
                            </a>
                            <span class="viewer-flag shrink-0">${headerIcon}</span>
                            <div class="min-w-0">
                                <h1 class="font-black text-base tracking-wider">${data.title}</h1>
                                <p class="text-[10px] text-indigo-200">${data.subtitle || ''}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-1 shrink-0">
                            <span class="viewer-date-chip text-[10px] font-semibold px-2 py-0.5 rounded-full">${dateRange}</span>
                            <button onclick="scrollToTools()" class="viewer-action bg-emerald-500 hover:bg-emerald-600 text-white text-[10px] font-bold py-1 px-2 rounded-full flex items-center gap-1 transition-all shadow-md active:scale-95">
                            <span class="relative flex h-2 w-2">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
                            </span>
                            ${data.actionText || 'VJW / 工具'}
                            </button>
                        </div>
                    </div>
                    <div id="tab-bar" class="viewer-tab-bar max-w-md mx-auto flex gap-1 overflow-x-auto scrollbar-none"></div>
                </header>

                <div class="viewer-flight-wrap max-w-md mx-auto px-4">
                    <div class="viewer-flight-card bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4">
                        <div class="flex justify-between items-center mb-3">
                            <span class="flight-label text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">
                                <i class="fa-solid fa-plane mr-1.5"></i>航班與倒數
                            </span>
                            <span id="countdown" class="text-xs font-semibold text-slate-500">計算中...</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 divide-x divide-slate-100">
                            <div>
                                <p class="flight-copy text-[9px] text-slate-400 font-bold uppercase">去程</p>
                                <p class="flight-copy text-xs font-bold text-slate-700 mt-0.5">${data.flights?.outbound || '尚未設定'}</p>
                            </div>
                            <div class="pl-4">
                                <p class="flight-copy text-[9px] text-slate-400 font-bold uppercase">回程</p>
                                <p class="flight-copy text-xs font-bold text-slate-700 mt-0.5">${data.flights?.inbound || '尚未設定'}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="viewer-map-wrap max-w-md mx-auto px-4">
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4" id="route-map-section">
                        <div class="flex items-center gap-2 mb-2">
                            <i class="fa-solid fa-map-marked-alt text-indigo-500"></i>
                            <h3 class="font-bold text-xs text-slate-700">路線地圖</h3>
                            <div class="flex items-center gap-2 ml-auto">
                                <button id="replay-btn" onclick="replayCar()" class="text-[10px] text-slate-400 hover:text-indigo-500 transition-colors" title="重播動畫">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </button>
                                <span id="route-day-label" class="text-[9px] font-bold text-indigo-500">D1</span>
                            </div>
                        </div>
                        <div class="w-full mx-auto rounded-xl" id="map-container" style="height:220px;"></div>
                    </div>
                </div>

                <main class="max-w-md mx-auto px-4">
                    <div id="tab-contents"></div>

                    <div id="tools-panel" class="tab-content hidden space-y-4 mt-4">
                        ${buildTripSupplementHTML(data)}
                        ${isDrive ? '' : `
                        <div id="checklist-section" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                            <div class="flex items-center gap-2 mb-3 text-slate-800">
                                <i class="fa-solid fa-clipboard-list text-indigo-500"></i>
                                <h3 class="font-bold text-sm">景點解鎖進度</h3>
                            </div>
                            <div id="checklist" class="space-y-2.5"></div>
                        </div>

                        <div id="ledger-section" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-2 text-slate-800">
                                    <i class="fa-solid fa-calculator text-indigo-500"></i>
                                    <h3 class="font-bold text-sm">記帳本</h3>
                                </div>
                                <div class="text-[10px] text-slate-400 font-bold">${currencyRate == null ? `${currencyName}匯率待補` : `1 ${currencyCode} ≈ ${currencyRate} TWD`}</div>
                            </div>
                            <div class="grid grid-cols-5 gap-1.5 mb-4">
                                <input type="text" id="expense-name" placeholder="項目" class="col-span-3 text-xs bg-slate-50 border border-slate-100 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <input type="number" id="expense-amount" placeholder="${currencyName}" class="col-span-2 text-xs bg-slate-50 border border-slate-100 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <button onclick="window.addExpense()" class="col-span-5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 rounded-xl transition-all shadow-md">新增記帳</button>
                            </div>
                            <div id="expense-list" class="divide-y divide-slate-100 max-h-[220px] overflow-y-auto"></div>
                            <div class="border-t border-slate-100 mt-3 pt-3 flex justify-between items-center">
                                <span class="text-xs font-bold text-slate-500">累計</span>
                                <div class="text-right">
                                    <p id="total-jpy" class="text-base font-black text-slate-800">0 ${currencyCode}</p>
                                    <p id="total-twd" class="text-[10px] font-bold text-slate-400">NT$ 0</p>
                                </div>
                            </div>
                        </div>
                        `}

                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                            <div class="flex items-center gap-2 mb-3 text-slate-800">
                                <i class="fa-solid fa-check-double text-emerald-500"></i>
                                <h3 class="font-bold text-sm">行前確認清單</h3>
                            </div>
                            <div id="pretrip-checklist" class="space-y-2">
                                <label class="flex items-center gap-2.5 cursor-pointer py-1"><input type="checkbox" onchange="togglePreTrip('passport')" class="rounded text-emerald-600 h-4 w-4"><span class="text-xs font-medium text-slate-700">🛂 護照</span></label>
                                <label class="flex items-center gap-2.5 cursor-pointer py-1"><input type="checkbox" onchange="togglePreTrip('license')" class="rounded text-emerald-600 h-4 w-4"><span class="text-xs font-medium text-slate-700">🚗 日文駕照譯本、台灣駕照、身分證</span></label>
                                <label class="flex items-center gap-2.5 cursor-pointer py-1"><input type="checkbox" onchange="togglePreTrip('money')" class="rounded text-emerald-600 h-4 w-4"><span class="text-xs font-medium text-slate-700">💳 信用卡、${currencyName}</span></label>
                                <label class="flex items-center gap-2.5 cursor-pointer py-1"><input type="checkbox" onchange="togglePreTrip('luggage')" class="rounded text-emerald-600 h-4 w-4"><span class="text-xs font-medium text-slate-700">🧳 行李、牙線、綿花棒、襪子、衣服</span></label>
                                <label class="flex items-center gap-2.5 cursor-pointer py-1"><input type="checkbox" onchange="togglePreTrip('phone')" class="rounded text-emerald-600 h-4 w-4"><span class="text-xs font-medium text-slate-700">📱 手機、充電器</span></label>
                                <label class="flex items-center gap-2.5 cursor-pointer py-1"><input type="checkbox" onchange="togglePreTrip('itinerary')" class="rounded text-emerald-600 h-4 w-4"><span class="text-xs font-medium text-slate-700">📋 行程表</span></label>
                                <label class="flex items-center gap-2.5 cursor-pointer py-1"><input type="checkbox" onchange="togglePreTrip('vjw')" class="rounded text-emerald-600 h-4 w-4"><span class="text-xs font-medium text-slate-700">🌐 Visit Japan Web</span></label>
                                <label class="flex items-center gap-2.5 cursor-pointer py-1"><input type="checkbox" onchange="togglePreTrip('medicine')" class="rounded text-emerald-600 h-4 w-4"><span class="text-xs font-medium text-slate-700">💊 藥（身心、血壓、眼藥）</span></label>
                            </div>
                        </div>

                        <div id="vjw-section" class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white rounded-2xl p-5 shadow-lg">
                            <div class="flex items-center gap-2 mb-3">
                                <i class="fa-solid fa-passport text-emerald-400"></i>
                                <h3 class="font-extrabold text-sm">Visit Japan Web</h3>
                            </div>
                            ${data.vjw ? `
                            <div class="space-y-2">
                                ${[['郵遞區號', 'vjw-zip', data.vjw.zip], ['住宿地址', 'vjw-addr', data.vjw.address], ['飯店名稱', 'vjw-name', data.vjw.name]].map(([label, id, val]) => `
                                <div class="bg-slate-800/60 rounded-xl p-3 flex justify-between items-center">
                                    <div>
                                        <p class="text-[9px] text-slate-400 font-bold">${label}</p>
                                        <p id="${id}" class="text-xs font-bold font-mono mt-0.5">${val || '尚未設定'}</p>
                                    </div>
                                    <button onclick="copyToClipboard('${val || ''}', '${label}')" class="bg-slate-700 hover:bg-indigo-600 text-white text-[10px] font-bold py-1 px-2.5 rounded-lg transition-all">複製</button>
                                </div>
                                `).join('')}
                            </div>
                            ` : '<p class="text-xs text-slate-400">無 VJW 資料</p>'}
                        </div>
                    </div>

                    <div class="mt-4 bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-slate-700"><i class="fa-solid fa-pen-nib mr-1.5 text-indigo-500"></i>隨手筆記</span>
                            <span class="text-[9px] text-slate-400 font-medium">每頁獨立儲存</span>
                        </div>
                        <textarea id="quick-note" oninput="window.saveNote()" rows="3" class="w-full text-xs bg-slate-50 border border-slate-100 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                </main>
            `;

            // Expose functions globally for onclick handlers
            window._state = state;
            window._data = data;
            window._saveState = saveState;
            window._APP_ID = APP_ID;

            // Setup tabs
            renderTabs(data, activeTab);
            renderDayContent(data, activeTab, state);
            window.switchTab = (tabId) => {
                activeTab = tabId;
                state.activeTab = tabId;
                saveState();
                document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
                if (tabId === 'tools') {
                    document.getElementById('tools-panel')?.classList.remove('hidden');
                } else {
                    const targetId = tabId.startsWith('tab-') ? tabId : `tab-${tabId}`;
                    document.getElementById(targetId)?.classList.remove('hidden');
                }
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.className = 'tab-btn px-3.5 py-3 rounded-xl font-bold text-xs flex-1 text-center whitespace-nowrap tab-transition bg-white text-slate-600 shadow-sm border border-slate-100';
                });
                const activeBtn = document.getElementById(`btn-${tabId}`);
                if (activeBtn) activeBtn.className = 'tab-btn px-3.5 py-3 rounded-xl font-bold text-xs flex-1 text-center whitespace-nowrap tab-transition bg-indigo-600 text-white shadow-md border border-indigo-500 pulse-active';
                updateNotePlaceholder(data, state);
            };

            window.scrollToTools = () => {
                window.switchTab('tools');
                setTimeout(() => {
                    document.getElementById('vjw-section')?.scrollIntoView({ behavior: 'smooth' });
                }, 100);
            };

            // Checklist
            if (!isDrive && data.sightsList) {
                renderChecklist(data, state);
                window.toggleSight = (id) => {
                    state.completedSights[id] = !state.completedSights[id];
                    saveState();
                    renderChecklist(data, state);
                };
            }

            window.toggleFood = (id) => {
                if (!state.completedFoods) state.completedFoods = {};
                state.completedFoods[id] = !state.completedFoods[id];
                saveState();
            };

            // Ledger
            if (!isDrive) {
                renderExpenses(data, state);
                window.addExpense = () => {
                    const name = document.getElementById('expense-name');
                    const amount = document.getElementById('expense-amount');
                    if (!name.value.trim() || !amount.value) return;
                    state.expenses.push({ id: Date.now(), name: name.value.trim(), amount: parseInt(amount.value) });
                    saveState();
                    renderExpenses(data, state);
                    name.value = ''; amount.value = '';
                };
                window.deleteExpense = (id) => {
                    state.expenses = state.expenses.filter(e => e.id !== id);
                    saveState();
                    renderExpenses(data, state);
                };
            }

            // Notes
            updateNotePlaceholder(data, state);
            window.saveNote = () => {
                const noteEl = document.getElementById('quick-note');
                state.quickNotes[activeTab] = noteEl.value;
                saveState();
            };

            // Pre-trip checklist
            renderPreTripChecklist(state);
            window.togglePreTrip = (id) => {
                if (!state.preTripChecked) state.preTripChecked = {};
                state.preTripChecked[id] = !state.preTripChecked[id];
                saveState();
                renderPreTripChecklist(state);
            };

            // Clipboard + Toast
            window.copyToClipboard = (text, label) => {
                navigator.clipboard?.writeText(text).then(() => showToast(`✅ ${label} 已複製`)).catch(() => showToast('❌ 複製失敗'));
            };
            function showToast(msg) {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div');
                t.className = 'bg-slate-900 text-white px-4 py-3 rounded-xl text-xs font-semibold shadow-lg border border-emerald-500 transition-all translate-y-2 opacity-0 duration-300';
                t.textContent = msg;
                c.appendChild(t);
                setTimeout(() => { t.classList.remove('translate-y-2', 'opacity-0'); }, 50);
                setTimeout(() => { t.remove(); }, 2500);
            }
            window.showToast = showToast;

            // Countdown
            if (data.countdownDate) startCountdown(data.countdownDate);

            // Inject map and draw initial route
            initMap(data).then(() => {
                // 延遲確保 map 完全渲染後再 fitBounds
                setTimeout(() => drawRoute(data, activeTab), 200);
            });

            // Switch to default tab
            window.switchTab(activeTab);

            // Update route on tab switch
            const origSwitch = window.switchTab;
            window.switchTab = (tabId) => {
                origSwitch(tabId);
                drawRoute(data, tabId);
            };
        }

        const DAY_COLORS = ['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
        const ROUTE_COLOR = '#ef4444';
        const PREF_STORAGE = 'japan-conquest-map-states';

        // Car animation
        let _carMarker = null;
        let _carAnimTimer = null;
        let _carAnimTimeout = null;
        let _carAnimPaused = false;
        let _carAnimResumeTimeout = null;
        let _currentTripData = null;
        let _currentTabId = null;

        function clearCarAnimation() {
            if (_carAnimTimer) { _carAnimTimer.cancel(); _carAnimTimer = null; }
            if (_carAnimTimeout) { clearTimeout(_carAnimTimeout); _carAnimTimeout = null; }
            if (_carAnimResumeTimeout) { clearTimeout(_carAnimResumeTimeout); _carAnimResumeTimeout = null; }
            _carAnimPaused = false;
            if (_carMarker) {
                if (window._routeLayer) window._routeLayer.removeLayer(_carMarker);
                else if (window._vMap) window._vMap.removeLayer(_carMarker);
                _carMarker = null;
            }
        }

        function pauseCarAnimation() {
            _carAnimPaused = true;
        }

        function resumeCarAnimation() {
            if (_carAnimResumeTimeout) clearTimeout(_carAnimResumeTimeout);
            _carAnimResumeTimeout = setTimeout(() => { _carAnimPaused = false; }, 300);
        }

        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
            return R * 2 * Math.asin(Math.sqrt(a));
        }

        function getBearing(lat1, lng1, lat2, lng2) {
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const y = Math.sin(dLng) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLng);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function rotateCar(bearing) {
            const el = _carMarker?.getElement();
            if (el) {
                const carDiv = el.querySelector('#car-icon');
                if (carDiv) carDiv.style.transform = `rotate(${bearing}deg)`;
            }
        }

        function animateCar(route) {
            clearCarAnimation();
            if (!route || route.length < 2) return;
            const vMap = window._vMap;
            if (!vMap) return;

            // SVG car icon pointing UP (0° = north)
            const carSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))">
                <path d="M12 2 L8 8 L6 8 L5 12 L3 14 L3 18 L21 18 L21 14 L19 12 L18 8 L16 8 Z" fill="#1e293b" stroke="#f1f5f9" stroke-width="1"/>
                <circle cx="7" cy="18" r="2.5" fill="#475569" stroke="#f1f5f9" stroke-width="1"/>
                <circle cx="17" cy="18" r="2.5" fill="#475569" stroke="#f1f5f9" stroke-width="1"/>
                <rect x="8" y="4" width="8" height="5" rx="1" fill="#60a5fa" opacity="0.7"/>
                <path d="M10 2 L14 2 L14 4 L10 4 Z" fill="#fbbf24"/>
            </svg>`;

            const carIcon = L.divIcon({
                html: `<div id="car-icon" style="transform-origin:center center;">${carSvg}</div>`,
                className: '',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });

            // Build cumulative distances
            const dists = [0];
            for (let i = 1; i < route.length; i++) {
                dists.push(dists[i-1] + haversine(route[i-1][0], route[i-1][1], route[i][0], route[i][1]));
            }
            const totalDist = dists[dists.length - 1];
            if (totalDist < 0.1) return; // too short

            const totalMs = 10000; // always 10 seconds

            function interp(dist) {
                // Find segment
                for (let i = 1; i < dists.length; i++) {
                    if (dists[i] >= dist) {
                        const segDist = dists[i] - dists[i-1];
                        const t = segDist > 0 ? (dist - dists[i-1]) / segDist : 0;
                        const lat = route[i-1][0] + (route[i][0] - route[i-1][0]) * t;
                        const lng = route[i-1][1] + (route[i][1] - route[i-1][1]) * t;
                        return { lat, lng, idx: i };
                    }
                }
                // End
                const last = route[route.length - 1];
                return { lat: last[0], lng: last[1], idx: route.length - 1 };
            }

            _carMarker = L.marker(route[0], { icon: carIcon, zIndexOffset: 1000 }).addTo(window._routeLayer || vMap);

            // Initial bearing
            const initPos = interp(0);
            const nextPos = interp(Math.min(totalDist * 0.01, 0.05));
            setTimeout(() => rotateCar(getBearing(initPos.lat, initPos.lng, nextPos.lat, nextPos.lng)), 50);

            let startTime = null;
            let animFrame = null;

            function step(ts) {
                if (!startTime) startTime = ts;
                const elapsed = ts - startTime;
                const progress = Math.min(elapsed / totalMs, 1);
                const dist = progress * totalDist;
                const pos = interp(dist);

                _carMarker.setLatLng([pos.lat, pos.lng]);

                if (progress < 1) {
                    animFrame = requestAnimationFrame(step);
                }
            }

            _carAnimTimeout = setTimeout(() => {
                animFrame = requestAnimationFrame(step);
                _carAnimTimer = { cancel: () => cancelAnimationFrame(animFrame) };
            }, 2000);
        }

        window.replayCar = () => {
            if (!_currentTripData || !_currentTabId) return;
            const actualDay = _currentTripData.actualDays?.[_currentTabId];
            const route = actualDay?.route?.length >= 2
                ? actualDay.route
                : window._plannedCarRoute;
            if (route?.length >= 2) animateCar(route);
        };

        function getItemCoordinates(data, item) {
            if (!item) return null;
            const lat = Number(item.lat);
            const lng = Number(item.lng ?? item.lon);
            if (Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };

            const mapped = item.mapUrl && data?.mapCoordinates?.[item.mapUrl];
            if (!mapped) return null;
            const mappedLat = Number(mapped.lat);
            const mappedLng = Number(mapped.lng ?? mapped.lon);
            return Number.isFinite(mappedLat) && Number.isFinite(mappedLng)
                ? { lat: mappedLat, lng: mappedLng }
                : null;
        }

        function getPlannedMapStops(data, day) {
            const stops = [];
            const seen = new Set();
            const routeItems = Array.isArray(day?.plannedRouteStops) && day.plannedRouteStops.length
                ? day.plannedRouteStops
                : (day?.timeline || []);
            routeItems.forEach(item => {
                const coordinates = getItemCoordinates(data, item);
                if (!coordinates) return;
                const key = `${coordinates.lat},${coordinates.lng}`;
                if (seen.has(key)) return;
                seen.add(key);
                stops.push({ ...item, ...coordinates });
            });
            return stops;
        }

        function getInitialMapView(data) {
            if (Array.isArray(data?.mapCenter) && data.mapCenter.length === 2) {
                const center = data.mapCenter.map(Number);
                if (center.every(Number.isFinite)) return { center, zoom: Number(data.mapZoom) || 11 };
            }

            const firstPlannedStop = Object.values(data?.days || {})
                .flatMap(day => getPlannedMapStops(data, day))
                .find(Boolean);
            if (firstPlannedStop) return { center: [firstPlannedStop.lat, firstPlannedStop.lng], zoom: 12 };

            return { center: [35.68, 139.76], zoom: 5 };
        }

        async function initMap(data) {
            const container = document.getElementById('map-container');
            if (!container) return;
            container.innerHTML = '';

            const initialView = getInitialMapView(data);
            const vMap = L.map('map-container', {
                zoomControl: true,
                attributionControl: true,
                scrollWheelZoom: true,
                dragging: true
            });
            vMap.setView(initialView.center, initialView.zoom);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>'
            }).addTo(vMap);
            window._vMap = vMap;
            window._routeLayer = L.layerGroup().addTo(vMap);
            // Force Leaflet to recalculate container size
            setTimeout(() => vMap.invalidateSize(), 300);

            // Load prefecture GeoJSON with conquest states
            const prefLayer = L.layerGroup().addTo(vMap);
            let customStates = {};
            try {
                const saved = localStorage.getItem(PREF_STORAGE);
                if (saved) customStates = JSON.parse(saved);
            } catch (e) {}

            fetch('trips/japan-prefectures.geojson')
                .then(r => r.json())
                .then(data => {
                    L.geoJSON(data, {
                        style: feature => {
                            const id = String(feature.properties.id).padStart(2, '0');
                            const state = customStates[id] || 'none';
                            const fillColors = { visited: '#ef4444', want: '#f59e0b', planned: '#3b82f6', none: '#e2e8f0' };
                            const fillOpacities = { visited: 0.65, want: 0.65, planned: 0.45, none: 0.25 };
                            return {
                                weight: 1, opacity: 0.6, color: '#94a3b8',
                                fillColor: fillColors[state], fillOpacity: fillOpacities[state]
                            };
                        },
                        interactive: false
                    }).addTo(prefLayer);
                });

            // Load city boundaries
            fetch('trips/japan-cities.geojson')
                .then(r => r.json())
                .then(cityData => {
                    L.geoJSON(cityData, {
                        style: () => ({
                            weight: 0.6, opacity: 0.35, color: '#94a3b8',
                            dashArray: '2,2', fillOpacity: 0, interactive: false
                        }),
                        interactive: false
                    }).addTo(vMap);
                });

            // 不在 initMap 做 fitBounds，由 drawRoute 處理
        }

        function drawRoute(data, tabId) {
            const vMap = window._vMap;
            if (!vMap) return;

            // Save current state for replay
            _currentTripData = data;
            _currentTabId = tabId;
            clearCarAnimation();
            window._plannedCarRoute = null;

            // Overview, food, and tools are content tabs; keep the last selected day route visible.
            if (tabId === 'tools' || !data.days[tabId]) return;

            // Remove previous route layers (keep tile + prefecture + city)
            window._routeLayer.clearLayers();

            // Force map to recalculate container size (critical on mobile Safari after tab switch)
            vMap.invalidateSize();
            const dayIndex = Object.keys(data.days).indexOf(tabId);

            // Draw actual route + stops for this day only
            const actualDay = data.actualDays ? data.actualDays[tabId] : null;
            if (actualDay) {
                // Route polyline
                if (actualDay.route && actualDay.route.length >= 2) {
                    L.polyline(actualDay.route, {
                        color: ROUTE_COLOR, weight: 3, opacity: 0.85
                    }).addTo(window._routeLayer);
                }

                // Stop markers
                if (actualDay.timeline) {
                    actualDay.timeline.forEach((stop, i) => {
                        const stopLng = stop.lng ?? stop.lon;
                        if (!stop.lat || !stopLng) return;
                        const isFirst = i === 0;
                        const isLast = i === actualDay.timeline.length - 1;
                        const r = (isFirst || isLast) ? 6 : 4;
                        const fill = (isFirst || isLast) ? ROUTE_COLOR : '#fff';

                        L.circleMarker([stop.lat, stopLng], {
                            radius: r, fillColor: fill, color: ROUTE_COLOR,
                            weight: 2, opacity: 1, fillOpacity: 1
                        }).addTo(window._routeLayer)
                            .bindTooltip(`${escapeHTML(stop.placeName || '')}<br><small>${escapeHTML(stop.actualTime || '')}</small>`, { direction: 'top', offset: [0, -4] })
                            .bindPopup(`<strong>${escapeHTML(stop.placeName || '路線停靠點')}</strong>${mapNavButton(stop)}`);
                    });
                }

                // OSM／GPS 景點標記（以狀態區分規劃落差）
                (actualDay.attractions || []).forEach(attraction => {
                    if (!attraction.lat || !(attraction.lng ?? attraction.lon)) return;
                    const lng = attraction.lng ?? attraction.lon;
                    const colors = {
                        visited: '#059669',
                        planned_not_visited: '#d97706',
                        unplanned_visited: '#4f46e5',
                        nearby: '#64748b'
                    };
                    const color = colors[attraction.status] || colors.nearby;
                    const source = attraction.sourceUrl ? `<br><a href="${escapeHTML(attraction.sourceUrl)}" target="_blank" rel="noreferrer">OpenStreetMap</a>` : '';
                    L.circleMarker([attraction.lat, lng], {
                        radius: 7, fillColor: color, color: '#fff', weight: 2,
                        opacity: 1, fillOpacity: 0.9
                    }).addTo(window._routeLayer).bindPopup(
                        `<strong>${escapeHTML(attraction.name)}</strong><br><small>${escapeHTML(attraction.category || '景點')}・${escapeHTML(attraction.status || '')}</small><br>${mapNavButton(attraction, true)}${source}`
                    );
                });

                // Fit + animate after map settles
                setTimeout(() => {
                    // Fit to this day's bounds
                    const dayLats = [], dayLngs = [];
                    if (actualDay.route) actualDay.route.forEach(([lat, lng]) => {
                        if (lat && lng) { dayLats.push(lat); dayLngs.push(lng); }
                    });
                    if (actualDay.timeline) actualDay.timeline.forEach(s => {
                        const lng = s.lng ?? s.lon;
                        if (s.lat && lng) { dayLats.push(s.lat); dayLngs.push(lng); }
                    });
                    (actualDay.attractions || []).forEach(s => {
                        const lng = s.lng ?? s.lon;
                        if (s.lat && lng) { dayLats.push(s.lat); dayLngs.push(lng); }
                    });
                    if (dayLats.length > 0) {
                        const pad = 0.008;
                        vMap.fitBounds([
                            [Math.min(...dayLats) - pad, Math.min(...dayLngs) - pad],
                            [Math.max(...dayLats) + pad, Math.max(...dayLngs) + pad]
                        ]);
                    }

                    // Animate car along route
                    if (actualDay.route && actualDay.route.length >= 2) {
                        animateCar(actualDay.route);
                    }
                }, 150);
            } else {
                // No actual data — use the Google Maps URL coordinates for planned stops.
                const day = data.days[tabId];
                const plannedStops = getPlannedMapStops(data, day);
                const plannedRoute = plannedStops.map(stop => [stop.lat, stop.lng]);

                if (plannedRoute.length >= 2) {
                    window._plannedCarRoute = plannedRoute;
                    L.polyline(plannedRoute, {
                        color: ROUTE_COLOR, weight: 3, opacity: 0.6, dashArray: '6,4'
                    }).addTo(window._routeLayer);
                } else if (day && day.route && day.route.length >= 2) {
                    window._plannedCarRoute = day.route;
                    L.polyline(day.route, {
                        color: ROUTE_COLOR, weight: 3, opacity: 0.6, dashArray: '6,4'
                    }).addTo(window._routeLayer);
                    plannedRoute.push(...day.route);
                }

                plannedStops.forEach((stop, index) => {
                    const isEndpoint = index === 0 || index === plannedStops.length - 1;
                    L.circleMarker([stop.lat, stop.lng], {
                        radius: isEndpoint ? 7 : 5,
                        fillColor: isEndpoint ? ROUTE_COLOR : '#fff',
                        color: ROUTE_COLOR, weight: 2, opacity: 1, fillOpacity: 1
                    }).addTo(window._routeLayer)
                        .bindTooltip(`${escapeHTML(stop.title || stop.name || '')}`, { direction: 'top', offset: [0, -4] })
                        .bindPopup(`<strong>${escapeHTML(stop.title || stop.name || '規劃停靠點')}</strong>${mapNavButton(stop)}`);
                });

                if (plannedRoute.length > 0) {
                    setTimeout(() => {
                        const dayLats = plannedRoute.map(point => point[0]);
                        const dayLngs = plannedRoute.map(point => point[1]);
                        const pad = 0.008;
                        vMap.fitBounds([
                            [Math.min(...dayLats) - pad, Math.min(...dayLngs) - pad],
                            [Math.max(...dayLats) + pad, Math.max(...dayLngs) + pad]
                        ]);
                        if (plannedRoute.length >= 2) animateCar(plannedRoute);
                    }, 150);
                }
            }

            // Update day label
            const label = document.getElementById('route-day-label');
            if (label) {
                label.textContent = `D${dayIndex + 1}`;
                label.style.color = ROUTE_COLOR;
            }
        }

        function loadState(appId, data) {
            const extraTabs = getSourceTabKeys(data);
            const firstTab = extraTabs.includes('tab-overview') ? 'tab-overview' : Object.keys(data.days)[0];
            try {
                const saved = localStorage.getItem(appId);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    const validTabs = [...extraTabs, ...Object.keys(data.days), 'tools'];
                    if (!validTabs.includes(parsed.activeTab)) parsed.activeTab = firstTab;
                    if (!parsed.completedFoods) parsed.completedFoods = {};
                    return parsed;
                }
            } catch(e) {}
            const defaultNotes = {};
            Object.keys(data.days).forEach(k => defaultNotes[k] = '');
            extraTabs.forEach(k => defaultNotes[k] = '');
            defaultNotes['tools'] = '';
            return {
                activeTab: firstTab,
                expenses: data.defaultExpenses ? JSON.parse(JSON.stringify(data.defaultExpenses)) : [],
                completedSights: {},
                completedFoods: {},
                quickNotes: defaultNotes,
                preTripChecked: {}
            };
        }

        function getSourceTabKeys(data) {
            const sections = data.sourceContent?.sections || {};
            return ['tab-overview', 'tab-food'].filter(key => Array.isArray(sections[key]) && sections[key].length);
        }

        function renderTabs(data, activeTab) {
            const bar = document.getElementById('tab-bar');
            bar.innerHTML = '';

            const addTab = (id, content) => {
                const btn = document.createElement('button');
                btn.id = `btn-${id}`;
                btn.className = 'tab-btn px-3.5 py-3 rounded-xl font-bold text-xs flex-1 text-center whitespace-nowrap tab-transition bg-white text-slate-600 shadow-sm border border-slate-100';
                btn.innerHTML = content;
                btn.onclick = () => window.switchTab(id);
                bar.appendChild(btn);
            };

            const sourceTabs = getSourceTabKeys(data);
            if (sourceTabs.includes('tab-overview')) {
                addTab('tab-overview', '<i class="fa-solid fa-compass mr-1"></i>總覽與實用指南');
            }
            Object.entries(data.days).forEach(([key, day]) => {
                addTab(key, `<div class="text-[9px] opacity-75">${day.date}</div>${day.label || key.toUpperCase()}`);
            });
            if (sourceTabs.includes('tab-food')) {
                addTab('tab-food', '<i class="fa-solid fa-utensils mr-1"></i>必吃打卡');
            }
            addTab('tools', '<div class="text-[9px] text-emerald-600"><i class="fa-solid fa-copy"></i></div>工具');
        }

        function renderDayContent(data, activeTab, state) {
            const container = document.getElementById('tab-contents');
            container.innerHTML = '';
            const sourceTabs = getSourceTabKeys(data);
            if (sourceTabs.includes('tab-overview')) {
                const overview = document.createElement('div');
                overview.id = 'tab-overview';
                overview.className = `tab-content ${activeTab === 'tab-overview' ? '' : 'hidden '}space-y-4`;
                overview.innerHTML = buildSourceTabHTML(data, 'tab-overview');
                container.appendChild(overview);
            }
            Object.entries(data.days).forEach(([key, day]) => {
                const div = document.createElement('div');
                div.id = `tab-${key}`;
                div.className = `tab-content ${activeTab === key ? '' : 'hidden '}space-y-4`;
                div.innerHTML = buildDayHTML(day, key, data.type === 'drive', data.actualDays?.[key]);
                container.appendChild(div);
            });
            if (sourceTabs.includes('tab-food')) {
                const food = document.createElement('div');
                food.id = 'tab-food';
                food.className = `tab-content ${activeTab === 'tab-food' ? '' : 'hidden '}space-y-4`;
                food.innerHTML = buildFoodTabHTML(data, state);
                container.appendChild(food);
            }
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]));
        }

        function getMapUrl(item) {
            if (!item) return '';
            if (item.mapUrl) return String(item.mapUrl);

            const lng = item.lng ?? item.lon;
            const lat = Number(item.lat);
            const longitude = Number(lng);
            if (Number.isFinite(lat) && Number.isFinite(longitude)) {
                return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${longitude}`)}`;
            }

            const place = item.placeName || item.name || item.title || '';
            const query = [place, item.address].filter(Boolean).join(', ');
            return query
                ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`
                : '';
        }

        function mapNavButton(item, compact = false) {
            const url = getMapUrl(item);
            if (!url) return '';
            const buttonClass = compact
                ? 'inline-flex items-center gap-1 text-[10px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2 py-1 rounded-lg'
                : 'mt-2 inline-flex items-center gap-1 text-[10px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1.5 rounded-lg';
            return `<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer" class="${buttonClass}"><i class="fa-solid fa-map-location-dot"></i> 導航</a>`;
        }

        function attractionStatusLabel(status) {
            return {
                visited: ['已造訪', 'bg-emerald-100 text-emerald-700'],
                planned_not_visited: ['規劃但未造訪', 'bg-amber-100 text-amber-700'],
                unplanned_visited: ['實際造訪', 'bg-indigo-100 text-indigo-700'],
                nearby: ['附近景點', 'bg-slate-100 text-slate-600']
            }[status] || ['景點', 'bg-slate-100 text-slate-600'];
        }

        function normalizePlannedPlaceName(value) {
            return String(value || '')
                .replace(/[（）()]/g, '')
                .replace(/^(完攻|前往|造訪|參觀|抵達)/, '')
                .replace(/[\s・：:，,、\-－]/g, '')
                .toLowerCase();
        }

        function findPlannedNotVisited(item, actualDay) {
            const itemName = normalizePlannedPlaceName(item.title || item.name);
            if (!itemName) return null;
            return (actualDay?.attractions || []).find(attraction => {
                if (attraction.status !== 'planned_not_visited') return false;
                return [attraction.name, attraction.plannedName].some(name => {
                    const candidate = normalizePlannedPlaceName(name);
                    return candidate && (itemName.includes(candidate) || candidate.includes(itemName));
                });
            }) || null;
        }

        function buildDayHTML(day, key, isDrive, actualDay = {}) {
            let html = `
                <div class="day-hero day-${key} bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-4 text-white shadow-md">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-bold bg-white/20 px-2 py-0.5 rounded-full">${day.date}</span>
                            <h2 class="text-base font-black mt-1">${day.title}</h2>
                        </div>
                        <span class="text-2xl font-black opacity-80">${key.toUpperCase()}</span>
                    </div>
                    <div class="mt-3 pt-3 border-t border-white/20 flex text-[10px] font-bold text-indigo-100">
                        <span>🕒 ${day.timeRange || ''}</span>
                    </div>
                </div>

                <div class="day-timeline-panel bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-xs mb-4 flex items-center gap-1.5">
                        <i class="fa-solid fa-route text-indigo-500"></i> 時間軸
                    </h3>
                    <div class="relative border-l-2 border-indigo-200 ml-3 pl-4 py-2 space-y-4">
            `;
            (day.timeline || []).forEach((item, index) => {
                const isTransit = item.type === 'transport' || item.type === 'drive';
                const missedPlan = isTransit ? null : findPlannedNotVisited(item, actualDay);
                const icon = isTransit ? (item.type === 'drive' ? 'fa-car-side text-blue-500' : 'fa-train-subway text-blue-500') : 'fa-location-dot text-indigo-500';
                const badge = isTransit ? (item.type === 'drive' ? '交通自駕' : '大眾交通') : '景點活動';
                const badgeClass = isTransit ? 'bg-blue-50 text-blue-600' : 'bg-indigo-50 text-indigo-600';
                const cardBorder = missedPlan ? 'border-amber-300 bg-amber-50/70' : (isTransit ? 'border-blue-100' : 'border-indigo-100');
                const timelineType = item.type || (isTransit ? 'transport' : 'sight');
                const missedNote = missedPlan
                    ? `<p class="text-[10px] font-bold text-amber-700 mt-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i>${missedPlan.visitConfirmation === 'user' ? '使用者確認：本趟未到訪' : 'GPS 未發現此規劃點的到訪證據'}</p>`
                    : '';
                let extra = '';
                extra += mapNavButton(item);
                if (item.mapcode) extra += `<button onclick="copyToClipboard('${item.mapcode}', 'Mapcode')" class="mt-2 inline-flex items-center gap-1 text-[10px] font-bold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg ml-1.5"><i class="fa-solid fa-keyboard"></i> ${item.mapcode}</button>`;
                html += `
                    <div class="relative timeline-card timeline-${timelineType} bg-white rounded-xl p-3 shadow-sm border ${cardBorder}">
                        <div class="timeline-marker timeline-marker-${timelineType} absolute -left-[27px] top-3 ${missedPlan ? 'bg-amber-500' : 'bg-indigo-600'} text-white rounded-full w-5 h-5 flex items-center justify-center text-[9px] border-2 border-white font-bold shadow-sm">
                            ${index + 1}
                        </div>
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="text-[10px] font-bold ${isTransit ? 'text-blue-600' : 'text-indigo-600'}"><i class="fa-solid ${icon} mr-1"></i>${item.time || ''}</span>
                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md border ${badgeClass}">${badge}</span>
                            ${missedPlan ? '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md border border-amber-200 bg-amber-100 text-amber-700">未到訪</span>' : ''}
                        </div>
                        <h4 class="text-sm font-bold ${missedPlan ? 'text-slate-500 line-through decoration-amber-500 decoration-2' : 'text-slate-800'} mt-1">${item.title || ''}</h4>
                        <p class="text-[11px] text-slate-500 mt-1 leading-relaxed">${item.detail || ''}</p>
                        ${missedNote}
                        <div class="flex flex-wrap">${extra}</div>
                    </div>
                `;
            });
            html += '</div></div>';

            const actualStops = actualDay?.timeline || [];
            if (actualStops.length > 0) {
                const stopTitle = actualDay?.source === 'planned' ? '模擬路線停靠點' : '實際 GPS 停留';
                html += `
                <div class="food-panel bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-xs mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-route text-rose-500"></i> ${stopTitle}
                    </h3>
                    <div class="space-y-2.5">
                `;
                actualStops.forEach(stop => {
                    const nav = mapNavButton(stop);
                    const time = stop.actualTime || stop.time || '';
                    html += `
                        <div class="rounded-xl p-3 border border-slate-100 bg-rose-50/40 flex items-start justify-between gap-2">
                            <div class="min-w-0">
                                <span class="text-xs font-bold text-slate-800">${escapeHTML(stop.placeName || stop.name || '路線停靠點')}</span>
                                ${time ? `<p class="text-[10px] text-slate-500 mt-1">${escapeHTML(time)}</p>` : ''}
                            </div>
                            ${nav}
                        </div>
                    `;
                });
                html += '</div></div>';
            }

            const attractions = actualDay?.attractions || [];
            if (attractions.length > 0) {
                html += `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-xs mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-location-dot text-emerald-500"></i> GPS 景點紀錄
                    </h3>
                    <div class="space-y-2.5">
                `;
                attractions.forEach(attraction => {
                    const [statusText, statusClass] = attractionStatusLabel(attraction.status);
                    const source = attraction.sourceUrl
                        ? `<a href="${escapeHTML(attraction.sourceUrl)}" target="_blank" rel="noreferrer" class="text-[10px] text-indigo-600 hover:underline">OSM</a>`
                        : '';
                    const nav = mapNavButton(attraction);
                    const distance = attraction.distanceMeters != null ? `${attraction.distanceMeters}m` : '';
                    const photos = attraction.photoCount ? `・${attraction.photoCount} 張照片` : '';
                    html += `
                        <div class="rounded-xl p-3 border border-slate-100 bg-slate-50/70">
                            <div class="flex items-start justify-between gap-2">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="text-xs font-bold text-slate-800">${escapeHTML(attraction.name)}</span>
                                        <span class="attraction-status ${statusClass}">${statusText}</span>
                                    </div>
                                    <p class="text-[10px] text-slate-500 mt-1">${escapeHTML(attraction.category || '景點')} ${distance}${photos}</p>
                                </div>
                                <div class="flex flex-col items-end gap-1 shrink-0">${nav}${source}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div></div>';
            }

            // Food
            if (day.food && day.food.length > 0) {
                html += `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-xs mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-utensils text-orange-500"></i> 美食
                    </h3>
                    <div class="space-y-3">
                `;
                day.food.forEach(f => {
                    const mc = (f.mapcode && isDrive) ? `<span class="text-[10px] font-mono text-green-700 font-bold">📟 ${f.mapcode}</span>` : '';
                    const mapLink = mapNavButton(f, true);
                    html += `
                        <div class="food-item bg-orange-50/40 rounded-xl p-3 border border-orange-100/30 flex justify-between items-start gap-3">
                            <div>
                                <span class="bg-orange-100 text-orange-700 text-[8px] font-bold px-1.5 py-0.5 rounded-md">${f.meal || ''}</span>
                                <span class="text-xs font-bold text-slate-800 ml-1.5">${f.name}</span>
                                <p class="text-[10px] text-slate-500 mt-0.5">${f.detail || ''}</p>
                                ${mc}
                            </div>
                            ${mapLink}
                        </div>
                    `;
                });
                html += '</div></div>';
            }

            // Parking (drive mode only)
            if (isDrive && day.parking && day.parking.length > 0) {
                html += `
                <div class="parking-panel bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-xs mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-square-parking text-blue-500"></i> 停車場
                    </h3>
                    <div class="space-y-3">
                `;
                day.parking.forEach(p => {
                    const mc = p.mapcode ? `<span class="text-[10px] font-mono text-green-700 font-bold">📟 ${p.mapcode}</span>` : '';
                    const mapLink = mapNavButton(p, true);
                    html += `
                        <div class="parking-item bg-blue-50/40 rounded-xl p-3 border border-blue-100/30 flex justify-between items-start gap-3">
                            <div>
                                <span class="bg-blue-100 text-blue-700 text-[8px] font-bold px-1.5 py-0.5 rounded-md">🅿️ ${p.name}</span>
                                <p class="text-[10px] text-slate-500 mt-0.5">${p.detail || ''}</p>
                                ${mc}
                            </div>
                            ${mapLink}
                        </div>
                    `;
                });
                html += '</div></div>';
            }

            // Hotel
            if (day.hotel) {
                const mc = (day.hotel.mapcode && isDrive) ? `<span class="text-[10px] font-mono text-green-700 font-bold mt-1 block">📟 ${day.hotel.mapcode}</span>` : '';
                const mapLink = mapNavButton(day.hotel, true);
                html += `
                <div class="hotel-panel bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-xs mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-hotel text-purple-500"></i> 住宿
                    </h3>
                    <div class="hotel-item bg-purple-50/40 rounded-xl p-3 border border-purple-100/30 flex justify-between items-start gap-3">
                        <div>
                            <h4 class="text-xs font-bold text-slate-800">${day.hotel.name}</h4>
                            <p class="text-[10px] text-slate-500">${day.hotel.detail || ''}</p>
                            ${day.hotel.address ? `<p class="text-[10px] text-slate-500 mt-1"><i class="fa-solid fa-location-dot text-purple-400 mr-1"></i>${day.hotel.address}</p>` : ''}
                            ${mc}
                        </div>
                        ${mapLink}
                    </div>
                </div>`;
            }

            // Details
            if (day.details) {
                html += `
                <div class="details-panel bg-amber-50 border border-amber-100 rounded-2xl p-4 flex gap-3">
                    <i class="fa-solid fa-circle-exclamation text-amber-500 text-sm shrink-0 mt-0.5"></i>
                    <p class="text-[10px] text-slate-600 leading-relaxed">${day.details}</p>
                </div>`;
            }

            return html;
        }

        function formatSourceLine(value) {
            return escapeHTML(value)
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code class="font-mono bg-slate-100 px-1 rounded">$1</code>');
        }

        function isSourceHeading(value) {
            const text = String(value || '').trim();
            return /^(🚗|🍽️|💵|📊|💡|全家|泰銖|航班|Grab|泰國|Woodstory|親友推薦|📍|【)/.test(text);
        }

        function sourceBulletText(value) {
            return String(value || '').replace(/^\s*[•·]\s*/, '').trim();
        }

        function buildSourceCard(title, icon, content, tone = 'emerald') {
            const palette = tone === 'rose'
                ? {
                    outer: 'bg-gradient-to-br from-rose-700 to-pink-900',
                    icon: 'text-rose-200',
                    inner: 'bg-white/10 border-white/15',
                    item: 'bg-black/20'
                }
                : {
                    outer: 'bg-gradient-to-br from-emerald-800 to-teal-900',
                    icon: 'text-emerald-200',
                    inner: 'bg-white/10 border-white/15',
                    item: 'bg-black/20'
                };
            return `
                <section class="source-original-card ${palette.outer} text-white rounded-2xl p-4 shadow-md">
                    <h2 class="font-black text-sm flex items-start gap-2 leading-snug">
                        <i class="fa-solid ${icon} ${palette.icon} mt-0.5 shrink-0"></i>
                        <span>${formatSourceLine(title)}</span>
                    </h2>
                    <div class="mt-3 space-y-2.5">${content}</div>
                </section>
            `;
        }

        function buildSourceGroup(group, tone = 'emerald') {
            const itemClass = tone === 'rose' ? 'bg-black/15' : 'bg-black/20';
            return `
                <div class="bg-white/10 p-2.5 rounded-xl border border-white/15">
                    ${group.title ? `<h3 class="font-bold text-[11px] mb-1.5">${formatSourceLine(group.title)}</h3>` : ''}
                    <div class="space-y-1">
                        ${(group.items || []).map(item => `<p class="font-mono text-[10px] leading-relaxed ${itemClass} p-1 rounded">${formatSourceLine(sourceBulletText(item))}</p>`).join('')}
                    </div>
                </div>
            `;
        }

        function buildOriginalOverviewHTML(data, lines) {
            const searchStart = lines.findIndex(line => String(line).startsWith('🚗 Grab 輸入英文速查清單'));
            const recommendationStart = lines.findIndex((line, index) => index > searchStart && String(line).startsWith('親友推薦：'));
            const remainderStart = lines.findIndex((line, index) => index > recommendationStart && /^(泰銖面額與換匯比例建議|全家 5 人換匯最佳策略)/.test(String(line)));
            const used = new Set();
            const mark = index => { if (index >= 0 && index < lines.length) used.add(index); };
            const cards = [];

            // Keep the latest airport pickup guide as its own original-style card.
            if (searchStart > 0) {
                const airportTitle = lines[0];
                const airportGroups = [];
                let group = null;
                for (let index = 1; index < searchStart; index += 1) {
                    mark(index);
                    const line = String(lines[index]);
                    if (/^(📍|💡)/.test(line)) {
                        group = { title: line, items: [] };
                        airportGroups.push(group);
                    } else if (group) {
                        group.items.push(line);
                    }
                }
                mark(0);
                cards.push(buildSourceCard(airportTitle, 'fa-taxi', airportGroups.map(item => buildSourceGroup(item)).join('')));
            }

            // Recreate the grouped Grab copy list from the authoritative source lines.
            if (searchStart >= 0) {
                const groups = [];
                let index = searchStart + 1;
                mark(searchStart);
                let group = null;
                while (index < lines.length && (recommendationStart < 0 || index < recommendationStart)) {
                    const line = String(lines[index]);
                    mark(index);
                    if (/^【/.test(line)) {
                        group = { title: line, items: [] };
                        groups.push(group);
                    } else if (group) {
                        group.items.push(line);
                    }
                    index += 1;
                }
                cards.push(buildSourceCard(lines[searchStart], 'fa-car', groups.map(item => buildSourceGroup(item)).join('')));
            }

            if (recommendationStart >= 0) {
                const end = remainderStart >= 0 ? remainderStart : lines.length;
                const recommendationLines = lines.slice(recommendationStart + 1, end);
                mark(recommendationStart);
                for (let index = recommendationStart + 1; index < end; index += 1) mark(index);
                cards.push(buildSourceCard(lines[recommendationStart], 'fa-fire', recommendationLines.map(line => `<p class="text-[11px] leading-relaxed">${formatSourceLine(line)}</p>`).join(''), 'rose'));
            }

            const remaining = lines.filter((line, index) => !used.has(index));
            if (remaining.length) {
                cards.push(`
                    <section class="source-tab-panel bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                        <div class="space-y-1.5">
                            ${remaining.map(line => `<p class="source-tab-line ${isSourceHeading(line) ? 'source-tab-heading' : ''}">${formatSourceLine(line)}</p>`).join('')}
                        </div>
                    </section>
                `);
            }
            return cards.join('');
        }

        function buildSourceTabHTML(data, key) {
            const lines = data.sourceContent?.sections?.[key] || [];
            const title = key === 'tab-overview' ? '總覽與實用指南' : '必吃打卡';
            const icon = key === 'tab-overview' ? 'fa-compass' : 'fa-utensils';
            if (key === 'tab-overview' && lines.length) return buildOriginalOverviewHTML(data, lines);
            return `
                <section class="source-tab-panel bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fa-solid ${icon} text-amber-500 text-lg"></i>
                        <h2 class="font-bold text-slate-800 text-sm">${title}</h2>
                    </div>
                    <div class="space-y-1.5">
                        ${lines.map(line => `<p class="source-tab-line ${isSourceHeading(line) ? 'source-tab-heading' : ''}">${formatSourceLine(line)}</p>`).join('')}
                    </div>
                </section>
            `;
        }

        function buildFoodTabHTML(data, state) {
            const items = data.foodTabItems || data.foodChecklist || [];
            if (!items.length) return buildSourceTabHTML(data, 'tab-food');
            return `
                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-900">
                    <h2 class="font-bold text-sm text-amber-800">🍽️ 您的完整美食必吃打卡清單</h2>
                    <p class="text-amber-700 mt-1">包含所有指定景點美食與親友特別推薦：</p>
                </div>
                <section class="food-tab-panel bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
                    ${items.map(item => {
                        const itemId = String(item.id ?? item.name);
                        const checked = state?.completedFoods?.[itemId] ? 'checked' : '';
                        const map = mapNavButton(item, true);
                        return `
                            <label class="food-tab-item flex items-start gap-3 p-2.5 rounded-xl cursor-pointer">
                                <input type="checkbox" data-food-id="${escapeHTML(itemId)}" onchange="toggleFood('${escapeHTML(itemId)}')" ${checked} class="w-4 h-4 mt-0.5 text-rose-600 rounded border-slate-300 shrink-0">
                                <div class="flex-1 min-w-0">
                                    <span class="font-bold text-rose-900 text-xs">${escapeHTML(item.name)}</span>
                                    <p class="text-slate-600 text-[11px] mt-0.5">${escapeHTML(item.detail || '')}</p>
                                    ${item.day ? `<p class="text-[10px] text-amber-700 mt-1 font-bold">${escapeHTML(item.day)}</p>` : ''}
                                    ${map}
                                </div>
                            </label>
                        `;
                    }).join('')}
                </section>
            `;
        }

        function renderChecklist(data, state) {
            const el = document.getElementById('checklist');
            if (!el) return;
            el.innerHTML = '';
            (data.sightsList || []).forEach(sight => {
                const checked = state.completedSights[sight.id] ? 'checked' : '';
                el.innerHTML += `
                    <div class="flex items-center justify-between p-1.5 hover:bg-slate-50 rounded-lg">
                        <label class="flex items-center gap-2 cursor-pointer w-full">
                            <input type="checkbox" onchange="toggleSight('${sight.id}')" ${checked} class="rounded text-indigo-600 h-4 w-4">
                            <span class="text-xs font-medium ${checked ? 'line-through text-slate-400' : 'text-slate-700'}">${sight.name}</span>
                        </label>
                    </div>
                `;
            });
        }

        function renderPreTripChecklist(state) {
            if (!state.preTripChecked) state.preTripChecked = {};
            const ids = ['passport','license','money','luggage','phone','itinerary','vjw','medicine'];
            ids.forEach(id => {
                const cb = document.querySelector(`#pretrip-checklist input[onchange*="${id}"]`);
                if (cb) cb.checked = !!state.preTripChecked[id];
            });
        }

        function buildTripSupplementHTML(data) {
            const sections = data.sourceContent?.sections || {};
            const sectionLabels = {
                'tab-overview': '總覽與實用指南（原文）',
                'tab-day1': 'Day 1 原文',
                'tab-day2': 'Day 2 原文',
                'tab-day3': 'Day 3 原文',
                'tab-day4': 'Day 4-5 原文',
                'tab-food': '必吃打卡清單（原文）'
            };
            const available = Object.entries(sectionLabels).filter(([key]) => Array.isArray(sections[key]) && sections[key].length);
            if (!available.length) return '';
            return `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div class="flex items-center gap-2 mb-3 text-slate-800">
                        <i class="fa-solid fa-file-lines text-amber-500"></i>
                        <h3 class="font-bold text-sm">原始內容完整保留</h3>
                    </div>
                    <p class="text-[11px] text-slate-500 mb-3">以下保留來源 HTML 的原始可見文字，結構化行程資料同時提供上方每日分頁使用。</p>
                    <div class="space-y-2">
                        ${available.map(([key, label]) => `
                            <details class="border border-slate-100 rounded-xl p-3">
                                <summary class="cursor-pointer text-xs font-bold text-slate-700">${escapeHTML(label)}</summary>
                                <div class="mt-3 space-y-1.5 text-[11px] text-slate-600 leading-relaxed">
                                    ${sections[key].map(text => `<p>${escapeHTML(text)}</p>`).join('')}
                                </div>
                            </details>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderExpenses(data, state) {
            const listEl = document.getElementById('expense-list');
            if (!listEl) return;
            listEl.innerHTML = '';
            let total = 0;
            state.expenses.forEach(item => {
                total += item.amount;
                listEl.innerHTML += `
                    <div class="flex justify-between items-center py-2 text-xs">
                        <span class="text-slate-700">${item.name}</span>
                        <div class="flex items-center gap-2.5">
                            <span class="font-bold text-slate-800">${item.amount.toLocaleString()} ${data.currency || 'JPY'}</span>
                            <button onclick="deleteExpense(${item.id})" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
            if (state.expenses.length === 0) listEl.innerHTML = '<p class="text-slate-400 text-center py-4">沒有花費記錄</p>';
            const currencyCode = data.currency || 'JPY';
            const rate = data.currencyToTwdRate ?? data.jpyToTwdRate ?? null;
            document.getElementById('total-jpy').textContent = `${total.toLocaleString()} ${currencyCode}`;
            document.getElementById('total-twd').textContent = rate == null ? 'NT$ —' : `NT$ ${Math.round(total * rate).toLocaleString()}`;
        }

        function updateNotePlaceholder(data, state) {
            const el = document.getElementById('quick-note');
            if (!el) return;
            const tab = state.activeTab;
            el.placeholder = tab === 'tools' ? '備忘記事...' : `${data.days[tab]?.label || tab} 筆記...`;
            el.value = state.quickNotes[tab] || '';
        }

        function startCountdown(target) {
            const t = new Date(target).getTime();
            function update() {
                const diff = t - Date.now();
                if (diff <= 0) { document.getElementById('countdown').innerHTML = '🎉 旅途愉快！'; return; }
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                document.getElementById('countdown').innerHTML = `<i class="fa-solid fa-hourglass-half text-amber-500 mr-1"></i> 剩 ${d} 天 ${h} 小時`;
            }
            update();
            setInterval(update, 60000);
        }
    </script>
</body>
</html>
