<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D52F 快樂遊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --ink: #172033;
            --muted: #647084;
            --paper: #fffaf2;
            --line: rgba(23, 32, 51, 0.12);
            --tokyo: #2563eb;
            --shikoku: #b42318;
            --green: #166534;
            --gold: #c7831f;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #f6f1e8;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                linear-gradient(180deg, rgba(255, 250, 242, 0.7), rgba(245, 247, 250, 0.96) 62%),
                url("https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=2200&q=80") center top / cover fixed;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .topbar {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 18px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            letter-spacing: 0;
            color: #ffffff;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }

        .topbar-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.88rem;
            font-weight: 700;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.42);
        }

        .hero {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: clamp(28px, 6vh, 72px) 0 32px;
        }

        .hero-layout {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
            gap: clamp(28px, 5vw, 64px);
            align-items: end;
        }

        .headline {
            max-width: 680px;
            color: #ffffff;
            text-shadow: 0 4px 28px rgba(0, 0, 0, 0.42);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding: 8px 12px;
            border-radius: 999px;
            color: #fff7da;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            font-size: 0.9rem;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 7vw, 6.6rem);
            line-height: 0.95;
            letter-spacing: 0;
            font-weight: 900;
        }

        .hero-copy {
            width: min(620px, 100%);
            margin: 22px 0 0;
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(1rem, 1.8vw, 1.22rem);
            line-height: 1.85;
            font-weight: 600;
        }

        .trip-grid {
            display: grid;
            gap: 18px;
        }

        .trip-card {
            min-height: 232px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.42);
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(13, 22, 39, 0.28);
            isolation: isolate;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        .trip-card:focus-visible {
            outline: 4px solid rgba(255, 255, 255, 0.8);
            outline-offset: 4px;
        }

        .trip-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 70px rgba(13, 22, 39, 0.34);
            border-color: rgba(255, 255, 255, 0.72);
        }

        .trip-media {
            position: absolute;
            inset: 0;
            z-index: -2;
            background-position: center;
            background-size: cover;
            transform: scale(1.02);
            transition: transform 240ms ease;
        }

        .trip-card:hover .trip-media {
            transform: scale(1.06);
        }

        .trip-card::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(90deg, rgba(12, 18, 31, 0.86), rgba(12, 18, 31, 0.42) 62%, rgba(12, 18, 31, 0.18)),
                linear-gradient(0deg, rgba(12, 18, 31, 0.52), rgba(12, 18, 31, 0.05));
        }

        .trip-content {
            min-height: 232px;
            padding: clamp(20px, 4vw, 30px);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 26px;
        }

        .trip-kicker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.86rem;
            font-weight: 800;
        }

        .trip-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .trip-title {
            margin: 0 0 10px;
            font-size: clamp(1.45rem, 3vw, 2.35rem);
            line-height: 1.18;
            letter-spacing: 0;
            font-weight: 900;
        }

        .trip-detail {
            margin: 0;
            max-width: 600px;
            color: rgba(255, 255, 255, 0.84);
            line-height: 1.75;
            font-size: 0.96rem;
            font-weight: 600;
        }

        .trip-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .mini-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mini-stat {
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.78rem;
            font-weight: 800;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .open-icon {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            color: #142033;
            background: #ffffff;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
        }

        .tokyo .trip-media {
            background-image: url("https://images.unsplash.com/photo-1542931287-023b922fa89b?auto=format&fit=crop&w=1400&q=80");
        }

        .shikoku .trip-media {
            background-image: url("https://images.unsplash.com/photo-1545569341-9eb8b30979d9?auto=format&fit=crop&w=1400&q=80");
        }

        .bangkok .trip-media {
            background-image: url("https://images.unsplash.com/photo-1508009603885-50cf7c579365?auto=format&fit=crop&w=1400&q=80");
        }

        .quick-row {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto 34px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .quick-item {
            min-height: 92px;
            padding: 18px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid var(--line);
            box-shadow: 0 14px 34px rgba(23, 32, 51, 0.08);
            backdrop-filter: blur(12px);
        }

        .quick-item i {
            color: var(--gold);
            margin-bottom: 8px;
        }

        .quick-label {
            margin: 0;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 800;
        }

        .quick-value {
            margin: 4px 0 0;
            color: var(--ink);
            font-size: 0.96rem;
            font-weight: 900;
        }

        footer {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 0 0 24px;
            color: rgba(23, 32, 51, 0.62);
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .archive-section {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto 34px;
        }

        .archive-title {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .archive-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(23, 32, 51, 0.04);
            backdrop-filter: blur(12px);
            transition: all 150ms ease;
            cursor: pointer;
        }

        .archive-card:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(23, 32, 51, 0.08);
            border-color: rgba(23, 32, 51, 0.22);
        }

        .archive-meta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .archive-year {
            font-size: 0.72rem;
            font-weight: 900;
            color: #ffffff;
            background: var(--muted);
            padding: 2px 8px;
            border-radius: 999px;
        }

        .archive-name {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--ink);
        }

        .archive-days {
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--gold);
        }

        @media (max-width: 900px) {
            body {
                background-attachment: scroll;
            }

            .hero-layout {
                grid-template-columns: 1fr;
                align-items: start;
            }

            .headline {
                padding-top: 18px;
            }

            .trip-grid {
                margin-top: 4px;
            }

            .quick-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 620px) {
            .topbar {
                width: min(100% - 24px, 1120px);
                padding: 14px 0 6px;
                align-items: flex-start;
            }

            .brand {
                font-size: 0.96rem;
            }

            .brand-mark {
                width: 38px;
                height: 38px;
                border-radius: 12px;
            }

            .topbar-meta {
                display: none;
            }

            .hero {
                width: min(100% - 24px, 1120px);
                padding: 22px 0 24px;
            }

            .eyebrow {
                font-size: 0.8rem;
            }

            .hero-copy {
                margin-top: 16px;
                line-height: 1.7;
            }

            .trip-card,
            .trip-content {
                min-height: 246px;
            }

            .trip-kicker {
                align-items: flex-start;
                flex-direction: column;
            }

            .trip-action {
                align-items: flex-end;
            }

            .mini-stats {
                gap: 6px;
            }

            .mini-stat {
                font-size: 0.74rem;
            }

            .quick-row {
                width: min(100% - 24px, 1120px);
                grid-template-columns: 1fr;
                margin-bottom: 22px;
            }

            .quick-item {
                min-height: 76px;
                padding: 14px 16px;
            }

            .archive-section {
                width: min(100% - 24px, 1120px);
            }

            .archive-grid {
                grid-template-columns: 1fr;
            }

            footer {
                width: min(100% - 24px, 1120px);
                flex-direction: column;
                padding-bottom: 18px;
            }
        }

        .map-section {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto 34px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 14px 34px rgba(23, 32, 51, 0.08);
            backdrop-filter: blur(12px);
        }

        .map-container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
            align-items: center;
        }

        #leaflet-map {
            width: 100%;
            height: 520px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,.08);
        }

        .leaflet-tooltip {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(30,30,40,0.85);
            color: #fff;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        .leaflet-tooltip::before {
            border-top-color: rgba(30,30,40,0.85);
        }

        .leaflet-control-zoom a {
            font-family: 'Noto Sans TC', sans-serif;
        }

        .city-label span {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 11px;
            font-weight: 500;
            color: #475569;
            text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 1px -1px 2px #fff, -1px 1px 2px #fff;
            white-space: nowrap;
            pointer-events: none;
        }

        .world-country-flag {
            background: transparent;
            border: 0;
            width: auto !important;
            height: auto !important;
            white-space: nowrap;
            pointer-events: auto;
        }

        .world-country-flag .flag-emoji {
            display: inline-block;
            font-size: 25px;
            line-height: 1;
            filter: drop-shadow(0 2px 2px rgba(23, 32, 51, 0.35));
            transform: translateY(-1px);
        }

        .world-country-flag .country-label {
            display: block;
            margin-top: 2px;
            padding: 2px 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            color: #334155;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 10px;
            font-weight: 800;
            line-height: 1.2;
            text-align: center;
            box-shadow: 0 1px 4px rgba(23, 32, 51, 0.16);
        }

        .world-country-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .world-country-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid rgba(23, 32, 51, 0.08);
            border-radius: 9px;
            background: rgba(248, 250, 252, 0.9);
            color: #334155;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .world-country-chip .country-chip-flag {
            flex: 0 0 auto;
            font-size: 20px;
        }

        .world-country-chip .country-chip-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .region-legend {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px 10px;
            margin-top: 4px;
        }

        .region-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .region-legend-color {
            width: 12px;
            height: 12px;
            flex: 0 0 auto;
            border-radius: 999px;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
        }

        .japan-region-label span {
            display: inline-block;
            padding: 3px 7px;
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.82);
            color: #334155;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 11px;
            font-weight: 900;
            line-height: 1.2;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(23, 32, 51, 0.16);
        }

        .map-controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .legend-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--ink);
        }

        .legend-color {
            width: 24px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .reset-btn {
            background: #ffffff;
            border: 1px solid var(--line);
            padding: 10px 16px;
            font-size: 0.78rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 150ms ease;
            color: var(--muted);
            text-align: center;
        }

        .reset-btn:hover {
            border-color: rgba(23,32,51,0.3);
            color: var(--ink);
        }

        .airport-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f1f5f9;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 8px;
            font-size: 0.74rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 150ms ease;
            color: var(--muted);
        }

        .airport-pill:hover {
            background: #e2e8f0;
            border-color: rgba(23,32,51,0.15);
        }

        .airport-pill[data-state="active"] {
            background: #10b981 !important;
            color: #ffffff !important;
            border-color: #059669 !important;
        }

        .airport-pill[data-state="planned"] {
            background: #3b82f6 !important;
            color: #ffffff !important;
            border-color: #2563eb !important;
        }

        @media (max-width: 620px) {
            .map-section {
                width: min(100% - 24px, 1120px);
                padding: 16px;
            }
            .map-container {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            #leaflet-map {
                height: 380px;
            }
            #world-map {
                height: 380px;
            }
            .archive-section {
                width: min(100% - 24px, 1120px);
            }
            .archive-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar" aria-label="網站頂部">
            <a class="brand" href="./index.html" aria-label="回到旅行入口">
                <span class="brand-mark"><i class="fa-solid fa-route"></i></span>
                <span>Chang Family Travel</span>
            </a>
            <div class="topbar-meta">
                <i class="fa-regular fa-calendar"></i>
                <span id="topbar-year-label">Summer Japan</span>
            </div>
        </header>

        <main>
            <section class="hero" aria-labelledby="page-title">
                <div class="hero-layout">
                    <div class="headline">
                        <div class="eyebrow">
                            <i class="fa-solid fa-plane-departure"></i>
                            <span>兩段旅程，一頁出發</span>
                        </div>
                        <h1 id="page-title">旅行入口</h1>
                        <p id="hero-description" class="hero-copy"></p>
                    </div>

                    <div class="trip-grid" aria-label="行程入口" id="trip-grid">
                    </div>
                </div>
            </section>

            <section class="archive-section" aria-label="歷年足跡回顧" id="archive-section">
                <h3 class="archive-title">
                    <i class="fa-solid fa-box-archive"></i>
                    <span>歷年足跡回顧</span>
                </h3>
                <div class="archive-grid" id="archive-grid">
                </div>
            </section>

            <section class="map-section" aria-label="日本制霸地圖">
                <h3 class="archive-title" style="margin-bottom: 18px;">
                    <i class="fa-solid fa-map-marked-alt"></i>
                    <span>日本制霸足跡地圖</span>
                </h3>
                <div class="map-container">
                    <div id="leaflet-map"></div>
                    <div class="map-controls">
                        <div class="legend-list">
                            <div class="legend-item">
                                <div class="legend-color" style="background: #60a5fa;"></div>
                                <span>規劃中 (自動套入)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #f97066;"></div>
                                <span>已制霸 (已去過，點擊地圖切換)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #fbbf24;"></div>
                                <span>想去 (點擊地圖切換)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #e2e8f0;"></div>
                                <span>未訪 (點擊地圖切換)</span>
                            </div>
                        </div>
                        <div>
                            <div style="margin-bottom: 8px; color: #64748b; font-size: 0.75rem; font-weight: 900;">日本區域分區</div>
                            <div id="japan-region-legend" class="region-legend" aria-label="日本區域分區圖例"></div>
                        </div>
                        <div id="conquest-level" style="margin-top:12px;padding:10px 14px;background:#fef3c7;border-radius:8px;font-size:13px;line-height:1.6;"></div>
                        <button onclick="resetMap()" class="reset-btn" style="margin-top:10px;">重設手動修改</button>
                    </div>
                </div>
            </section>

            <section class="map-section" aria-label="世界旅行足跡地圖">
                <h3 class="archive-title" style="margin-bottom: 18px;">
                    <i class="fa-solid fa-earth-asia"></i>
                    <span>世界旅行足跡地圖</span>
                </h3>
                <div class="map-container">
                    <div id="world-map"></div>
                    <div class="map-controls">
                        <div class="legend-list">
                            <div class="legend-item">
                                <span style="font-size: 24px; line-height: 1;">🚩</span>
                                <span>已去過的國家</span>
                            </div>
                            <div class="legend-item" style="font-size: 0.76rem; font-weight: 600; line-height: 1.6;">
                                <i class="fa-solid fa-circle-info" style="color: #64748b;"></i>
                                <span>依已完成行程的 GPS 足跡與航班機場資料自動整理</span>
                            </div>
                        </div>
                        <div id="world-visited-count" style="margin-top:12px;padding:10px 14px;background:#ecfeff;border-radius:8px;font-size:13px;line-height:1.6;"></div>
                        <div id="world-visited-list" class="world-country-list" aria-label="已去過國家清單"></div>
                    </div>
                </div>
            </section>

            <section class="quick-row" aria-label="旅行摘要">
                <div class="quick-item">
                    <i class="fa-solid fa-users"></i>
                    <p class="quick-label">同行成員</p>
                    <p class="quick-value">Chang 家族 5 人</p>
                </div>
                <div class="quick-item">
                    <i class="fa-solid fa-suitcase-rolling"></i>
                    <p class="quick-label">旅行月份</p>
                    <p class="quick-value" id="stat-months">計算中...</p>
                </div>
                <div class="quick-item">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <p class="quick-label">行程數量</p>
                    <p class="quick-value" id="stat-count">計算中...</p>
                </div>
                <div class="quick-item">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <p class="quick-label">使用方式</p>
                    <p class="quick-value">手機也可直接開啟</p>
                </div>
            </section>
        </main>

        <footer>
            <span>入口頁：index.html</span>
            <span>祝旅途一路順風，該買的周邊都買得到。</span>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 1. Load trips from JSON and render
        // ==========================================
        let allTrips = [];

        async function loadTrips() {
            try {
                const res = await fetch('trips/manifest.json');
                if (!res.ok) throw new Error('manifest not found');
                const ids = await res.json();
                const tripPromises = ids.map(id =>
                    fetch(`trips/${id}.json`).then(r => r.json())
                );
                allTrips = await Promise.all(tripPromises);
            } catch (e) {
                console.warn('No trip data yet:', e.message);
                renderTrips();
                updateStats();
                return;
            }
            renderTrips();
            updateStats();
            updateMapPlanned();
            loadMapData();
        }

        function renderTrips() {
            const now = new Date();
            const activeTrips = allTrips.filter(t => new Date(t.dateEnd) >= now);
            const archiveTrips = allTrips.filter(t => new Date(t.dateEnd) < now);

            const grid = document.getElementById('trip-grid');
            const archiveGrid = document.getElementById('archive-grid');
            grid.innerHTML = '';
            archiveGrid.innerHTML = '';

            // Update title & description
            if (activeTrips.length > 0) {
                const years = [...new Set(activeTrips.map(t => t.dateStart.slice(0,4)))];
                document.getElementById('page-title').textContent = `${years.join('/')} D52F 快樂遊`;
                document.getElementById('hero-description').textContent =
                    activeTrips.map(t => t.description).join(' ');
                document.getElementById('topbar-year-label').textContent =
                    `${years.join('/')} Summer Japan`;
            }

            // Render active trips as big cards
            activeTrips.forEach(t => {
                const card = document.createElement('a');
                card.className = `trip-card ${t.image}`;
                card.href = `viewer.html?trip=${t.id}`;
                card.innerHTML = `
                    <span class="trip-media" aria-hidden="true"></span>
                    <div class="trip-content">
                        <div>
                            <div class="trip-kicker">
                                <span class="trip-badge"><i class="fa-solid ${t.badgeIcon}"></i> ${t.badge}</span>
                                <span>${t.dateStart.slice(5)} - ${t.dateEnd.slice(5)}</span>
                            </div>
                            <h2 class="trip-title">${t.title}</h2>
                            <p class="trip-detail">${t.description}</p>
                        </div>
                        <div class="trip-action">
                            <div class="mini-stats">
                                ${t.stats.map(s => `<span class="mini-stat">${s}</span>`).join('')}
                            </div>
                            <span class="open-icon"><i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Fallback placeholder if no active trips
            if (activeTrips.length === 0) {
                const nextYear = String(new Date().getFullYear() + 1);
                const placeholder = document.createElement('div');
                placeholder.className = 'trip-card';
                placeholder.innerHTML = `
                    <div class="trip-content" style="justify-content:center;align-items:center;text-align:center;min-height:232px;">
                        <div>
                            <div style="font-size:2.5rem;margin-bottom:12px;">✨</div>
                            <h2 class="trip-title">${nextYear} 年旅行規劃中</h2>
                            <p class="trip-detail">下一趟家族冒險正在醞釀中，敬請期待！</p>
                        </div>
                    </div>
                `;
                grid.appendChild(placeholder);
            }

            // Render archive trips as compact cards
            archiveTrips.forEach(t => {
                const card = document.createElement('div');
                card.className = 'archive-card';
                card.onclick = () => location.href = `viewer.html?trip=${t.id}`;
                const year = t.dateStart.slice(0,4);
                card.innerHTML = `
                    <div class="archive-meta">
                        <span class="archive-year">${year}</span>
                        <span class="archive-name">${t.title}</span>
                    </div>
                    <span class="archive-days">${t.stats[0] || ''} ➔</span>
                `;
                archiveGrid.appendChild(card);
            });

            // Hide archive section if empty
            document.getElementById('archive-section').style.display =
                archiveTrips.length > 0 ? '' : 'none';
        }

        function updateStats() {
            const now = new Date();
            const active = allTrips.filter(t => new Date(t.dateEnd) >= now);
            if (active.length > 0) {
                const months = [...new Set(active.map(t => {
                    const d = new Date(t.dateStart);
                    return d.getMonth() + 1;
                }))].sort((a,b) => a-b);
                const year = active[0].dateStart.slice(0,4);
                document.getElementById('stat-months').textContent =
                    `${year} 年 ${months.join('-')} 月`;
            }
            document.getElementById('stat-count').textContent =
                `${allTrips.filter(t => new Date(t.dateEnd) >= new Date()).length} 趟規劃中`;
        }

// ==========================================
        // 1. Trip data → map planning
        // ==========================================
        function updateMapPlanned() {
            const now = new Date();
            const active = allTrips.filter(t => new Date(t.dateEnd) >= now);
            const codes = [...new Set(active.flatMap(t => t.prefectures || []))];
            const airports = [...new Set(active.flatMap(t => t.airports || []))];
            window.PLANNED_CODES.length = 0;
            window.PLANNED_CODES.push(...codes);
            window.PLANNED_AIRPORTS.length = 0;
            window.PLANNED_AIRPORTS.push(...airports);
        }

        // ==========================================
        // 2. Map constants
        // ==========================================
        var PLANNED_CODES = [];
        var PLANNED_AIRPORTS = [];
        const STORAGE_KEY = 'japan-conquest-map-states';
        const AIRPORT_STORAGE_KEY = 'japan-conquest-airports';
        let allAirports = []; // 從 ourairports.json 載入

        const ROUTE_COLORS = [
            '#EF4444','#F97316','#EAB308','#22C55E','#14B8A6',
            '#3B82F6','#6366F1','#A855F7','#EC4899','#F43F5E',
            '#06B6D4','#84CC16','#F59E0B','#10B981','#8B5CF6','#0EA5E9'
        ];

        const JAPAN_REGIONS = [
            { name: '北海道', codes: ['01'], color: '#0ea5e9', label: [43.35, 142.7] },
            { name: '東北', codes: ['02','03','04','05','06','07'], color: '#14b8a6', label: [39.25, 140.9] },
            { name: '關東', codes: ['08','09','10','11','12','13','14'], color: '#6366f1', label: [35.55, 139.35] },
            { name: '中部', codes: ['15','16','17','18','19','20','21','22','23'], color: '#8b5cf6', label: [36.0, 137.0] },
            { name: '關西', codes: ['24','25','26','27','28','29','30'], color: '#ec4899', label: [34.85, 135.55] },
            { name: '中國', codes: ['31','32','33','34','35'], color: '#f97316', label: [34.75, 132.0] },
            { name: '四國', codes: ['36','37','38','39'], color: '#eab308', label: [33.75, 133.65] },
            { name: '九州', codes: ['40','41','42','43','44','45','46','47'], color: '#ef4444', label: [32.15, 130.6] }
        ];
        const JAPAN_REGION_BY_CODE = Object.fromEntries(
            JAPAN_REGIONS.flatMap(region => region.codes.map(code => [code, region]))
        );

        // ==========================================
        // 3. Helper functions
        // ==========================================
        function getVisitedCodes() {
            const now = new Date();
            const completed = allTrips.filter(t => new Date(t.dateEnd) < now);
            return [...new Set(completed.flatMap(t => t.prefectures || []))];
        }

        function getPrefState(code, customStates, visited, planned) {
            if (customStates[code]) return customStates[code];
            if (visited.includes(code)) return 'visited';
            if (planned.includes(code)) return 'planning';
            return 'unvisited';
        }

        function getPrefColor(state) {
            switch (state) {
                case 'planning': return '#60a5fa';
                case 'visited':  return '#f97066';
                case 'want':     return '#fbbf24';
                default:         return '#e2e8f0';
            }
        }

        function getAirportState(code, customStates, plannedAirports, activeTrips) {
            if (customStates[code]) return customStates[code];
            const isActive = activeTrips.some(t => (t.airports || []).includes(code));
            const isPlanned = plannedAirports.includes(code);
            if (isActive) return 'active';
            if (isPlanned) return 'planned';
            return 'unvisited';
        }

        function getAirportColor(state) {
            switch (state) {
                case 'active':  return '#10b981';
                case 'planned': return '#3b82f6';
                default:        return '#94a3b8';
            }
        }

        // ==========================================
        // 4. Conquest level
        // ==========================================
        function updateConquestLevel() {
            const TOTAL_PREFECTURES = 47;
            const levels = [
                { name: '未踏足', min: 0, icon: '🏁', desc: '尚未制霸任何都道府縣' },
                { name: '初級冒險者', min: 1, icon: '🌱', desc: '踏出第一步！' },
                { name: '見習旅人', min: 5, icon: '🎒', desc: '開始上手了' },
                { name: '中級探索者', min: 10, icon: '🗺️', desc: '足跡遍佈半個日本' },
                { name: '高級冒險家', min: 15, icon: '⛰️', desc: '征服了不少地方' },
                { name: '資深旅人', min: 20, icon: '🏯', desc: '日本通！' },
                { name: '制霸達人', min: 25, icon: '⛩️', desc: '幾乎全日本都去過' },
                { name: '傳說冒險家', min: 30, icon: '🐉', desc: '超越想像的旅歷' },
                { name: '日本制霸王', min: TOTAL_PREFECTURES, icon: '👑', desc: '全47都道府縣制霸！' },
            ];
            const el = document.getElementById('conquest-level');
            if (!el) return;
            const visited = getVisitedCodes();
            const count = visited.length;
            let current = levels[0], next = levels[1];
            for (let i = levels.length - 1; i >= 0; i--) {
                if (count >= levels[i].min) {
                    current = levels[i];
                    next = levels[i + 1] || null;
                    break;
                }
            }
            const pct = Math.min(100, Math.round((count / TOTAL_PREFECTURES) * 100));
            const barColor = count >= TOTAL_PREFECTURES ? '#f59e0b' : count >= 25 ? '#f97066' : '#60a5fa';
            el.innerHTML = `
                <div style="font-weight:bold;font-size:15px;margin-bottom:4px;">
                    ${current.icon} 制霸等級：${current.name}
                </div>
                <div style="color:#6b7280;font-size:12px;margin-bottom:6px;">${current.desc}</div>
                <div style="background:#e5e7eb;border-radius:6px;height:8px;overflow:hidden;">
                    <div style="background:${barColor};height:100%;width:${pct}%;border-radius:6px;transition:width .5s;"></div>
                </div>
                <div style="color:#6b7280;font-size:11px;margin-top:4px;">
                    ${count} / ${TOTAL_PREFECTURES} 都道府縣已制霸${next ? `（下一等級：${next.name}）` : '（最高等級！）'}
                </div>
            `;
        }

        // ==========================================
        // 5. Leaflet map initialization
        // ==========================================
        let map, prefectureLayer, cityLayer, regionLabelLayer, airportLayer, routeLayer;
        let worldMap, worldAdmin1Layer, worldVisitedLayer;
        let geoJsonPrefData = null;
        let geoJsonCityData = null;
        let geoJsonWorldAdmin1 = null;
        let worldCountryFeatures = [];
        let worldCountryMeta = new Map();
        let visitedWorldCountries = new Map();
        let worldRegionDisplayNames = null;

        function initLeafletMap() {
            if (map) return;
            map = L.map('leaflet-map', {
                center: [36.5, 138.0],
                zoom: 5,
                minZoom: 4,
                maxZoom: 14,
                zoomControl: true,
                attributionControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom: 18
            }).addTo(map);

            prefectureLayer = L.layerGroup().addTo(map);
            cityLayer = L.layerGroup();
            regionLabelLayer = L.layerGroup().addTo(map);
            routeLayer = L.layerGroup().addTo(map);
            airportLayer = L.layerGroup().addTo(map);

            let _lastZoomBracket = '';
            let _zoomDebounce = null;

            map.on('zoomend', function() {
                // Debounce: only process after user stops zooming
                if (_zoomDebounce) clearTimeout(_zoomDebounce);
                _zoomDebounce = setTimeout(() => {
                    const zoom = map.getZoom();

                    // City layer: show at zoom>=8
                    if (zoom >= 8 && !map.hasLayer(cityLayer)) {
                        map.addLayer(cityLayer);
                    } else if (zoom < 8 && map.hasLayer(cityLayer)) {
                        map.removeLayer(cityLayer);
                    }

                    // Re-z-order route/airport layers above everything
                    map.removeLayer(routeLayer); map.addLayer(routeLayer);
                    map.removeLayer(airportLayer); map.addLayer(airportLayer);

                    // Only re-render airports when zoom bracket changes (performance)
                    const bracket = zoom < 5 ? 's' : zoom < 7 ? 'm' : zoom < 8 ? 'l' : 'h';
                    if (bracket !== _lastZoomBracket) {
                        _lastZoomBracket = bracket;
                        renderAirportMarkers();
                    }

                    // 永久隱藏區級標籤，只保留市級標籤；zoom 12+ 隱藏全部
                    document.querySelectorAll('.city-label').forEach(el => {
                        const text = el.textContent || '';
                        const isWard = /区$/.test(text);
                        if (isWard || zoom >= 12) {
                            el.style.display = 'none';
                        } else {
                            el.style.display = '';
                        }
                    });
                }, 200);
            });

            renderRegionLabels();
        }

        function initWorldMap() {
            if (worldMap) return;
            worldMap = L.map('world-map', {
                center: [20, 10],
                zoom: 2,
                minZoom: 2,
                maxZoom: 8,
                zoomControl: true,
                attributionControl: true,
                worldCopyJump: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom: 18
            }).addTo(worldMap);

            worldAdmin1Layer = L.layerGroup().addTo(worldMap);
            worldVisitedLayer = L.layerGroup().addTo(worldMap);
            worldMap.on('zoomend moveend', () => {
                renderWorldAdmin1();
            });
        }

        // ==========================================
        // 6. Prefecture GeoJSON layer
        // ==========================================
        function loadPrefectureGeoJSON() {
            fetch('trips/japan-prefectures.geojson')
                .then(r => r.json())
                .then(data => {
                    geoJsonPrefData = data;
                    renderPrefectures();
                })
                .catch(e => console.error('Failed to load prefecture GeoJSON:', e));
        }

        function renderPrefectures() {
            prefectureLayer.clearLayers();
            if (!geoJsonPrefData) return;

            let customStates = {};
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) customStates = JSON.parse(saved);
            } catch (e) {}

            const visited = getVisitedCodes();
            const planned = window.PLANNED_CODES || [];

            L.geoJSON(geoJsonPrefData, {
                style: function(feature) {
                    const rawId = String(feature.properties.id);
                    const code = rawId.padStart(2, '0');
                    const state = getPrefState(code, customStates, visited, planned);
                    const region = JAPAN_REGION_BY_CODE[code];
                    return {
                        fillColor: getPrefColor(state),
                        weight: region ? 2 : 1,
                        opacity: 1,
                        color: region ? region.color : '#000',
                        fillOpacity: 0.7
                    };
                },
                onEachFeature: function(feature, layer) {
                    const rawId = String(feature.properties.id);
                    const code = rawId.padStart(2, '0');
                    const name = feature.properties.nam_ja || feature.properties.nam || '';

                    layer.bindTooltip(name, { sticky: true, className: 'pref-tooltip' });

                    layer.on('click', function() {
                        const currentState = getPrefState(code, customStates, visited, planned);
                        let nextState;
                        if (planned.includes(code)) {
                            if (currentState === 'planning') nextState = 'visited';
                            else if (currentState === 'visited') nextState = 'want';
                            else nextState = 'planning';
                        } else {
                            if (currentState === 'unvisited') nextState = 'visited';
                            else if (currentState === 'visited') nextState = 'want';
                            else nextState = 'unvisited';
                        }
                        customStates[code] = nextState;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(customStates));
                        layer.setStyle({ fillColor: getPrefColor(nextState) });
                        updateConquestLevel();
                    });

                    layer.on('mouseover', function() {
                        layer.setStyle({ weight: 3, color: '#4f46e5', fillOpacity: 0.85 });
                    });
                    layer.on('mouseout', function() {
                        prefectureLayer.eachLayer(function(l) {
                            if (!l.feature) return;
                            const rid = String(l.feature.properties.id).padStart(2, '0');
                            const st = getPrefState(rid, customStates, visited, planned);
                            const region = JAPAN_REGION_BY_CODE[rid];
                            l.setStyle({
                                weight: region ? 2 : 1,
                                color: region ? region.color : '#000',
                                fillColor: getPrefColor(st),
                                fillOpacity: 0.7
                            });
                        });
                    });
                }
            }).addTo(prefectureLayer);
        }

        function renderRegionLabels() {
            if (!regionLabelLayer) return;
            regionLabelLayer.clearLayers();
            JAPAN_REGIONS.forEach(region => {
                const icon = L.divIcon({
                    className: 'japan-region-label',
                    html: `<span style="border-color:${region.color};">${region.name}</span>`,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });
                L.marker(region.label, { icon, interactive: false }).addTo(regionLabelLayer);
            });
        }

        function renderRegionLegend() {
            const legend = document.getElementById('japan-region-legend');
            if (!legend) return;
            legend.innerHTML = JAPAN_REGIONS.map(region => `
                <div class="region-legend-item">
                    <span class="region-legend-color" style="background:${region.color};"></span>
                    <span>${region.name}</span>
                </div>
            `).join('');
        }

        // ==========================================
        // 7. City GeoJSON layer
        // ==========================================
        function loadCityGeoJSON() {
            fetch('trips/japan-cities.geojson')
                .then(r => r.json())
                .then(data => {
                    geoJsonCityData = data;
                    renderCities();
                })
                .catch(e => console.error('Failed to load city GeoJSON:', e));
        }

        function renderCities() {
            cityLayer.clearLayers();
            if (!geoJsonCityData) return;

            const labelLayer = L.layerGroup();

            L.geoJSON(geoJsonCityData, {
                style: function() {
                    return {
                        weight: 0.8,
                        opacity: 0.5,
                        color: '#888',
                        dashArray: '3,3',
                        fillOpacity: 0,
                        interactive: false
                    };
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    const c3 = p.N03_003 || '';
                    const c4 = p.N03_004 || '';
                    // 只顯示「市」和「區」，隱藏「郡」「町」「村」
                    let label = '';
                    if (c4 && !/[町村郡]/.test(c4)) {
                        // 有區 → 顯示 市+區（如：福岡市博多區）
                        label = c3 + c4;
                    } else if (c3 && !/[町村郡]/.test(c3) && /市$/.test(c3)) {
                        // 以「市」結尾且不含町村郡 → 顯示
                        label = c3;
                    }
                    if (!label) return;

                    const centroid = layer.getBounds().getCenter();
                    const icon = L.divIcon({
                        className: 'city-label',
                        html: '<span>' + label + '</span>',
                        iconSize: [0, 0],
                        iconAnchor: [0, 0]
                    });
                    L.marker(centroid, { icon: icon, interactive: false }).addTo(labelLayer);
                }
            }).addTo(cityLayer);

            labelLayer.addTo(cityLayer);
            
            // 延遲套用 zoom 過濾，確保 DOM 已更新；永久隱藏區級標籤
            setTimeout(() => {
                const zoom = map.getZoom();
                document.querySelectorAll('.city-label').forEach(el => {
                    const text = el.textContent || '';
                    const isWard = /区$/.test(text);
                    if (isWard || zoom >= 12) {
                        el.style.display = 'none';
                    }
                });
            }, 100);
        }

        // ==========================================
        // 7b. World admin1 GeoJSON layer
        // ==========================================
        function loadWorldAdmin1() {
            fetch('trips/world-admin1.geojson')
                .then(r => r.json())
                .then(data => {
                    geoJsonWorldAdmin1 = data;
                    rebuildWorldCountryMeta();
                    renderWorldAdmin1();
                    renderWorldVisitedCountries();
                })
                .catch(e => console.error('Failed to load world admin1 GeoJSON:', e));
        }

        function isWorldCountryCode(code) {
            return /^[A-Z]{2}$/.test(String(code || '').toUpperCase()) && code !== 'XX';
        }

        function getWorldCountryCode(feature) {
            const code = String(feature?.properties?.iso_a2 || '').toUpperCase();
            return isWorldCountryCode(code) ? code : '';
        }

        function getWorldCountryDisplayName(code, fallback) {
            const overrides = { TW: '台灣', JP: '日本', KR: '韓國', CN: '中國', US: '美國' };
            if (overrides[code]) return overrides[code];
            try {
                if (!worldRegionDisplayNames) {
                    worldRegionDisplayNames = new Intl.DisplayNames(['zh-Hant'], { type: 'region' });
                }
                return worldRegionDisplayNames.of(code) || fallback || code;
            } catch (e) {
                return fallback || code;
            }
        }

        function rebuildWorldCountryMeta() {
            worldCountryFeatures = (geoJsonWorldAdmin1?.features || []).filter(f => getWorldCountryCode(f));
            worldCountryMeta = new Map();
            worldCountryFeatures.forEach(feature => {
                const code = getWorldCountryCode(feature);
                const props = feature.properties || {};
                const latitude = Number(props.latitude);
                const longitude = Number(props.longitude);
                const current = worldCountryMeta.get(code) || {
                    code,
                    name: getWorldCountryDisplayName(code, props.admin || props.name_en || code),
                    latTotal: 0,
                    lngTotal: 0,
                    centroidCount: 0
                };
                if (Number.isFinite(latitude) && Number.isFinite(longitude)) {
                    current.latTotal += latitude;
                    current.lngTotal += longitude;
                    current.centroidCount += 1;
                }
                worldCountryMeta.set(code, current);
            });
        }

        // 從 GeoJSON 座標直接計算 bbox（不建立 Leaflet layer）
        function geoJsonBbox(feature) {
            if (Array.isArray(feature.bbox) && feature.bbox.length >= 4) {
                return {
                    minLon: feature.bbox[0],
                    minLat: feature.bbox[1],
                    maxLon: feature.bbox[2],
                    maxLat: feature.bbox[3]
                };
            }
            const geom = feature.geometry;
            if (!geom) return null;
            let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
            const process = (ring) => {
                for (let i = 0; i < ring.length; i++) {
                    const lon = ring[i][0], lat = ring[i][1];
                    if (lat < minLat) minLat = lat;
                    if (lat > maxLat) maxLat = lat;
                    if (lon < minLon) minLon = lon;
                    if (lon > maxLon) maxLon = lon;
                }
            };
            if (geom.type === 'Polygon') {
                geom.coordinates.forEach(process);
            } else if (geom.type === 'MultiPolygon') {
                geom.coordinates.forEach(poly => poly.forEach(process));
            } else {
                return null;
            }
            return { minLat, maxLat, minLon, maxLon };
        }

        function bboxIntersects(a, b) {
            return !(a.minLat > b.maxLat || a.maxLat < b.minLat ||
                     a.minLon > b.maxLon || a.maxLon < b.minLon);
        }

        function renderWorldAdmin1() {
            if (!worldAdmin1Layer || !worldMap) return;
            worldAdmin1Layer.clearLayers();
            if (!geoJsonWorldAdmin1 || worldMap.getZoom() < 3) return;

            const bounds = worldMap.getBounds();
            const pad = 0.5;
            const visBbox = {
                minLat: bounds.getSouth() - pad, maxLat: bounds.getNorth() + pad,
                minLon: bounds.getWest() - pad, maxLon: bounds.getEast() + pad
            };

            const renderer = L.canvas({ padding: 0.5 });
            geoJsonWorldAdmin1.features.forEach(f => {
                try {
                    const fb = geoJsonBbox(f);
                    if (!fb || !bboxIntersects(visBbox, fb)) return;
                    const code = getWorldCountryCode(f);
                    const visited = visitedWorldCountries.has(code);
                    L.geoJSON(f, {
                        style: {
                            weight: visited ? 0.8 : 0.5,
                            opacity: visited ? 0.7 : 0.4,
                            color: visited ? '#d97706' : '#94a3b8',
                            dashArray: '3,3',
                            fillColor: visited ? '#fef3c7' : '#f8fafc',
                            fillOpacity: visited ? 0.28 : 0.06,
                            interactive: false
                        },
                        renderer: renderer
                    }).addTo(worldAdmin1Layer);
                } catch(e) {}
            });
        }

        function pointInRing(lng, lat, ring) {
            let inside = false;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const xi = ring[i][0], yi = ring[i][1];
                const xj = ring[j][0], yj = ring[j][1];
                const intersects = ((yi > lat) !== (yj > lat)) &&
                    (lng < (xj - xi) * (lat - yi) / ((yj - yi) || Number.EPSILON) + xi);
                if (intersects) inside = !inside;
            }
            return inside;
        }

        function pointInWorldFeature(lng, lat, feature) {
            const geometry = feature.geometry;
            if (!geometry) return false;
            const inPolygon = polygon => pointInRing(lng, lat, polygon[0]) &&
                polygon.slice(1).every(hole => !pointInRing(lng, lat, hole));
            if (geometry.type === 'Polygon') return inPolygon(geometry.coordinates);
            if (geometry.type === 'MultiPolygon') return geometry.coordinates.some(inPolygon);
            return false;
        }

        function findWorldCountryAt(lat, lng) {
            for (const feature of worldCountryFeatures) {
                const bbox = geoJsonBbox(feature);
                if (!bbox || lng < bbox.minLon || lng > bbox.maxLon || lat < bbox.minLat || lat > bbox.maxLat) continue;
                if (pointInWorldFeature(lng, lat, feature)) return getWorldCountryCode(feature);
            }
            return '';
        }

        function flagEmoji(code) {
            if (!isWorldCountryCode(code)) return '🚩';
            return String.fromCodePoint(...code.split('').map(letter => 127397 + letter.charCodeAt(0)));
        }

        function addVisitedWorldCountry(code, trip, fallbackPoint) {
            if (!isWorldCountryCode(code)) return;
            const meta = worldCountryMeta.get(code) || {
                code,
                name: getWorldCountryDisplayName(code, code),
                latTotal: 0,
                lngTotal: 0,
                centroidCount: 0
            };
            const current = visitedWorldCountries.get(code) || {
                code,
                name: meta.name,
                lat: meta.centroidCount ? meta.latTotal / meta.centroidCount : null,
                lng: meta.centroidCount ? meta.lngTotal / meta.centroidCount : null,
                trips: new Set()
            };
            if (!Number.isFinite(current.lat) && fallbackPoint) {
                current.lat = fallbackPoint[0];
                current.lng = fallbackPoint[1];
            }
            current.trips.add(trip.id);
            visitedWorldCountries.set(code, current);
        }

        function renderWorldVisitedCountries() {
            if (!worldMap || !worldVisitedLayer) return;
            visitedWorldCountries = new Map();
            const completedTrips = allTrips.filter(trip => trip.dateEnd && new Date(trip.dateEnd) < new Date());

            completedTrips.forEach(trip => {
                if (trip.actualDays && worldCountryFeatures.length) {
                    Object.values(trip.actualDays).forEach(day => {
                        const points = [];
                        (day.route || []).forEach(point => {
                            if (Array.isArray(point) && Number.isFinite(Number(point[0])) && Number.isFinite(Number(point[1]))) {
                                points.push([Number(point[0]), Number(point[1])]);
                            }
                        });
                        (day.timeline || []).forEach(point => {
                            const lng = point.lng ?? point.lon;
                            if (Number.isFinite(Number(point.lat)) && Number.isFinite(Number(lng))) {
                                points.push([Number(point.lat), Number(lng)]);
                            }
                        });
                        points.forEach(point => addVisitedWorldCountry(findWorldCountryAt(point[0], point[1]), trip, point));
                    });
                }

                const flightText = [trip.flights?.outbound, trip.flights?.inbound, ...(trip.airports || [])]
                    .filter(Boolean).join(' ');
                const flightCodes = [...new Set(flightText.match(/\b[A-Z]{3}\b/g) || [])]
                    .filter(code => code !== 'PNR');
                flightCodes.forEach(code => {
                    const airport = allAirports.find(item => item.iata === code);
                    if (airport?.country) addVisitedWorldCountry(airport.country, trip, [airport.lat, airport.lon]);
                });
            });

            worldVisitedLayer.clearLayers();
            visitedWorldCountries.forEach(country => {
                if (!Number.isFinite(country.lat) || !Number.isFinite(country.lng)) return;
                const icon = L.divIcon({
                    className: 'world-country-flag',
                    html: `<span class="flag-emoji">${flagEmoji(country.code)}</span><span class="country-label">${escapeMapHTML(country.name)}</span>`,
                    iconSize: [80, 54],
                    iconAnchor: [40, 48]
                });
                const marker = L.marker([country.lat, country.lng], { icon, zIndexOffset: 1000 });
                marker.bindTooltip(`${flagEmoji(country.code)} ${escapeMapHTML(country.name)}<br><small>${country.trips.size} 趟旅程</small>`, {
                    direction: 'top',
                    offset: [0, -42]
                });
                marker.addTo(worldVisitedLayer);
            });

            const list = [...visitedWorldCountries.values()].sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
            const count = document.getElementById('world-visited-count');
            const listEl = document.getElementById('world-visited-list');
            if (count) count.innerHTML = `<strong>已去過 ${list.length} 個國家</strong><br><span style="color:#64748b;">旗幟會依完成行程自動更新，未完成的規劃不會提前計入。</span>`;
            if (listEl) listEl.innerHTML = list.length
                ? list.map(country => `<div class="world-country-chip"><span class="country-chip-flag">${flagEmoji(country.code)}</span><span class="country-chip-name">${escapeMapHTML(country.name)}</span></div>`).join('')
                : '<div style="grid-column:1/-1;color:#64748b;font-size:0.78rem;">目前還沒有可辨識的已造訪國家。</div>';

            renderWorldAdmin1();
        }

        // ==========================================
        // 8. Airport markers
        // ==========================================
        function loadAirports() {
            fetch('trips/ourairports.json')
                .then(r => r.json())
                .then(data => {
                    allAirports = data;
                    renderAirportMarkers();
                    renderWorldVisitedCountries();
                })
                .catch(e => console.error('Failed to load airports:', e));
        }

        function renderAirportMarkers() {
            airportLayer.clearLayers();
            if (!allAirports.length) return;

            let customStates = {};
            try {
                const saved = localStorage.getItem(AIRPORT_STORAGE_KEY);
                if (saved) customStates = JSON.parse(saved);
            } catch (e) {}

            const now = new Date();
            const activeTrips = allTrips.filter(t => new Date(t.dateEnd) >= now);
            const plannedAirports = window.PLANNED_AIRPORTS || [];
            const zoom = map.getZoom();
            const bounds = map.getBounds();

            // 依 zoom 決定顯示哪些機場
            // zoom < 5: 只顯示 large（國際樞紐）
            // zoom 5-7: 顯示 large + medium（區域機場）
            // zoom >= 8: 顯示全部
            allAirports.forEach(ap => {
                const lat = ap.lat, lng = ap.lon;
                if (!lat || !lng) return;

                // 只渲染可見範圍內的機場
                if (!bounds.contains([lat, lng])) return;

                // zoom 篩選：只顯示 large 或 zoom 夠高
                if (zoom < 7 && ap.type !== 'large_airport') return;

                const state = getAirportState(ap.iata, customStates, plannedAirports, activeTrips);
                const color = getAirportColor(state);
                const isMajor = ap.type === 'large_airport';
                const fontSize = isMajor ? 18 : 14;
                const icon = L.divIcon({
                    className: 'airport-marker',
                    html: `<span style="font-size:${fontSize}px;color:${color};filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));cursor:pointer;">✈</span>`,
                    iconSize: [fontSize, fontSize],
                    iconAnchor: [fontSize/2, fontSize/2]
                });

                const marker = L.marker([lat, lng], { icon: icon });

                marker.bindTooltip(`${ap.name} (${ap.iata})`, { direction: 'top', offset: [0, -fontSize/2] });

                marker.on('click', function() {
                    const curState = customStates[ap.iata] || state;
                    let nextState;
                    if (curState === 'unvisited') nextState = 'planned';
                    else if (curState === 'planned') nextState = 'active';
                    else if (curState === 'active') nextState = 'unvisited';
                    else nextState = 'unvisited';
                    customStates[ap.iata] = nextState;
                    localStorage.setItem(AIRPORT_STORAGE_KEY, JSON.stringify(customStates));
                    const newColor = getAirportColor(nextState);
                    marker.setIcon(L.divIcon({
                        className: 'airport-marker',
                        html: `<span style="font-size:${fontSize}px;color:${newColor};filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));cursor:pointer;">✈</span>`,
                        iconSize: [fontSize, fontSize],
                        iconAnchor: [fontSize/2, fontSize/2]
                    }));
                });

                marker.addTo(airportLayer);
            });
        }

        // ==========================================
        // 9. Trip route polylines
        // ==========================================
        function escapeMapHTML(value) {
            return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]));
        }

        function getMapUrlForItem(item) {
            if (!item) return '';
            if (item.mapUrl) return String(item.mapUrl);
            const lng = item.lng ?? item.lon;
            if (Number.isFinite(Number(item.lat)) && Number.isFinite(Number(lng))) {
                return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${item.lat},${lng}`)}`;
            }
            const place = item.placeName || item.name || item.title || '';
            const query = [place, item.address].filter(Boolean).join(', ');
            return query ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}` : '';
        }

        function mapPopupLink(item) {
            const url = getMapUrlForItem(item);
            return url
                ? `<br><a href="${escapeMapHTML(url)}" target="_blank" rel="noopener noreferrer">🧭 開啟 Google 地圖導航</a>`
                : '';
        }

        function drawActualRoutes() {
            routeLayer.clearLayers();

            allTrips.forEach((trip, tripIdx) => {
                if (!trip.actualDays) return;
                const color = ROUTE_COLORS[tripIdx % ROUTE_COLORS.length];

                const allCoords = [];
                Object.values(trip.actualDays).forEach(day => {
                    if (day.route && day.route.length > 1) {
                        allCoords.push(...day.route);
                    }
                });

                if (allCoords.length > 1) {
                    L.polyline(allCoords, {
                        color: color,
                        weight: 3,
                        opacity: 0.75,
                        smoothFactor: 1
                    }).addTo(routeLayer);
                }

                // 收集此行程所有停留點（用於就近命名）
                const stops = [];
                Object.entries(trip.actualDays).forEach(([dayKey, day]) => {
                    if (!day.timeline) return;
                    day.timeline.forEach(s => {
                        if (s.lat && s.lng) stops.push(s);
                    });
                });

                function findNearestStop(lat, lng) {
                    let best = null, bestDist = Infinity;
                    for (const s of stops) {
                        const d = Math.abs(s.lat - lat) + Math.abs(s.lng - lng);
                        if (d < bestDist) { bestDist = d; best = s; }
                    }
                    // 距離 < 0.05 度（約 5km）才命名
                    return bestDist < 0.05 ? best : null;
                }

                // 先畫路線點（底層）
                Object.entries(trip.actualDays).forEach(([dayKey, day]) => {
                    if (!day.route) return;
                    day.route.forEach(([lat, lng]) => {
                        if (!lat || !lng) return;
                        const m = L.circleMarker([lat, lng], {
                            radius: 3, fillColor: color, color: '#fff',
                            weight: 1, opacity: 0.8, fillOpacity: 0.7,
                            interactive: true
                        });
                        const near = findNearestStop(lat, lng);
                        const label = near
                            ? `${near.placeName || ''}${near.actualTime ? '<br><small>' + near.actualTime + '</small>' : ''}`
                            : `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        m.bindTooltip(label, { direction: 'top', offset: [0, -4] });
                        m.addTo(routeLayer);
                    });
                });

                // 再畫停留點（上層，較大較醒目）
                stops.forEach(stop => {
                    const stopLng = stop.lng ?? stop.lon;
                    if (!stop.lat || !stopLng) return;
                    const marker = L.circleMarker([stop.lat, stopLng], {
                        radius: 5, fillColor: color, color: '#fff',
                        weight: 2, opacity: 1, fillOpacity: 1
                    });
                    marker.bindTooltip(
                        `${stop.placeName || ''}<br><small>${stop.actualTime || ''}</small>`,
                        { direction: 'top', offset: [0, -6] }
                    );
                    marker.bindPopup(`<strong>${escapeMapHTML(stop.placeName || '路線停靠點')}</strong>${mapPopupLink(stop)}`);
                    marker.addTo(routeLayer);
                });

                // 景點標記：綠色為實際造訪，橘色為規劃但未造訪，藍色為未規劃但實際出現
                Object.values(trip.actualDays).forEach(day => {
                    (day.attractions || []).forEach(attraction => {
                        const lng = attraction.lng ?? attraction.lon;
                        if (!attraction.lat || !lng) return;
                        const colors = {
                            visited: '#059669',
                            planned_not_visited: '#d97706',
                            unplanned_visited: '#4f46e5',
                            nearby: '#64748b'
                        };
                        const color = colors[attraction.status] || colors.nearby;
                        const marker = L.circleMarker([attraction.lat, lng], {
                            radius: 6, fillColor: color, color: '#fff',
                            weight: 2, opacity: 1, fillOpacity: 0.9
                        });
                        const status = {
                            visited: '已造訪',
                            planned_not_visited: '規劃但未造訪',
                            unplanned_visited: '實際造訪',
                            nearby: '附近景點'
                        }[attraction.status] || '景點';
                        marker.bindTooltip(
                            `${escapeMapHTML(attraction.name || '景點')}<br><small>${status}・${escapeMapHTML(day.date || '')}</small>`,
                            { direction: 'top', offset: [0, -6] }
                        );
                        if (attraction.sourceUrl) {
                            marker.bindPopup(`<strong>${escapeMapHTML(attraction.name || '景點')}</strong><br><small>${status}</small>${mapPopupLink(attraction)}<br><a href="${escapeMapHTML(attraction.sourceUrl)}" target="_blank" rel="noreferrer">OpenStreetMap</a>`);
                        } else {
                            marker.bindPopup(`<strong>${escapeMapHTML(attraction.name || '景點')}</strong><br><small>${status}</small>${mapPopupLink(attraction)}`);
                        }
                        marker.addTo(routeLayer);
                    });
                });
            });
        }

        // ==========================================
        // 10. Load all map data
        // ==========================================
        function loadMapData() {
            loadPrefectureGeoJSON();
            loadCityGeoJSON();
            loadWorldAdmin1();
            loadAirports();
            drawActualRoutes();
            renderRegionLegend();
            renderWorldVisitedCountries();
            updateConquestLevel();
        }

        function resetMap() {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(AIRPORT_STORAGE_KEY);
            loadMapData();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLeafletMap();
            initWorldMap();
            loadTrips();
        });
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
            initLeafletMap();
            initWorldMap();
            loadTrips();
        }
    </script>
</body>
</html>
